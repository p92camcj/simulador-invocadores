<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invocadores · figuras de bloques (boceto)</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1b2a; overflow: hidden; font-family: system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; }
  #titulo { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; color: #fff;
    font-weight: 700; font-size: 20px; text-shadow: 0 2px 6px #000a; pointer-events: none; }
  #titulo small { display: block; font-weight: 400; font-size: 12px; opacity: .75; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 0 max(10px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, #14121fe6 30%); display: flex; flex-direction: column; gap: 8px; }
  .fila { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px; scrollbar-width: none; align-items: center; }
  .fila::-webkit-scrollbar { display: none; }
  .fila button { flex: none; border: 2px solid #ffffff30; background: #2c2842; color: #f3eefe; border-radius: 999px;
    padding: 9px 15px; font-size: 15px; font-family: inherit; cursor: pointer; }
  .fila button.activo { background: #f2c230; color: #2a1d05; border-color: #f2c230; font-weight: 700; }
  .fila button.flecha { width: 44px; padding: 9px 0; font-size: 18px; }
  .fila button.invocar { background: #7a1022; border-color: #e8284a; }
  .fila .sep { flex: none; width: 1px; height: 26px; background: #ffffff30; }
</style>
</head>
<body>
<div id="titulo">Todos<small>Desliza para girar · pellizca para acercar · toca un personaje para verlo solo</small></div>
<div id="panel">
  <div class="fila" id="filaPersonajes"></div>
  <div class="fila" id="filaAnimaciones"></div>
</div>
<script type="module">
import * as THREE from '../vendor/three/three.module.min.js';

// ---------- escena ----------
const params = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const escena = new THREE.Scene();
escena.background = new THREE.Color('#2a2640');
escena.fog = new THREE.Fog('#2a2640', 110, 200);
const camara = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 200);

escena.add(new THREE.HemisphereLight('#fff6e8', '#5a4f7a', 1.1));
const sol = new THREE.DirectionalLight('#fff3dc', 2.2);
sol.position.set(6, 14, 10);
sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -24, right: 24, top: 20, bottom: -20, far: 80 });
escena.add(sol);
const relleno = new THREE.DirectionalLight('#9fb6ff', 0.6);
relleno.position.set(-8, 5, -6);
escena.add(relleno);

// plástico brillante
const plastico = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.32, metalness: 0, ...extra });
const brillo = (color, intensidad = 1.6) => new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: intensidad, roughness: 0.2, transparent: true, opacity: 0.85 });

function sombra(m) { m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return m; }

// ---------- placa base con tetones ----------
// Tetones HEXAGONALES (no redondos): estilo propio, inspirado en los juguetes de bloques sin copiarlos.
const TETON = new THREE.CylinderGeometry(0.25, 0.25, 0.17, 6);
// Orbes y llamas que levitan: cada uno con su propio ritmo (arriba/abajo, izquierda/derecha).
const FLOTANTES = [];
let semillaFlot = 1;
function flotar(obj, amp = 0.12) {
  const r = () => (semillaFlot = (semillaFlot * 16807) % 2147483647) / 2147483647;
  obj.userData.flota = { base: obj.position.clone(), amp, fx: 0.7 + r() * 0.9, fy: 0.9 + r() * 1.1, fz: 0.6 + r() * 0.8, px: r() * 6.28, py: r() * 6.28, pz: r() * 6.28 };
  FLOTANTES.push(obj);
  return obj;
}
function moverFlotantes(T) {
  for (const o of FLOTANTES) {
    const u = o.userData.flota;
    o.position.set(u.base.x + Math.sin(T * u.fx + u.px) * u.amp, u.base.y + Math.sin(T * u.fy + u.py) * u.amp * 1.3, u.base.z + Math.sin(T * u.fz + u.pz) * u.amp * 0.6);
  }
}
function placa(ancho, fondo, color, paso = 0.8) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(ancho * paso, 0.32, fondo * paso), plastico(color));
  base.position.y = -0.16;
  g.add(base);
  const mt = plastico(color);
  const tetones = new THREE.InstancedMesh(TETON, mt, ancho * fondo);
  let i = 0; const m = new THREE.Matrix4();
  for (let x = 0; x < ancho; x++) for (let z = 0; z < fondo; z++) {
    m.makeTranslation((x - (ancho - 1) / 2) * paso, 0.085, (z - (fondo - 1) / 2) * paso);
    tetones.setMatrixAt(i++, m);
  }
  g.add(tetones);
  return sombra(g);
}
const suelo = placa(52, 50, '#4f8a4b');
suelo.position.y = -0.02;
escena.add(suelo);

// Portal de bloques: la misma construcción que el Portal del Escenario (tarima escalonada con
// disco rúnico, escalinata delantera, piedras bajas con ojos rúnicos, dos pilares altos con arco,
// dos pilares bajos, resplandor del umbral), montada con ladrillos y tetones hexagonales.
const ALTO = 0.96; // altura de la tarima: tres capas de ladrillo
const PIEDRA = '#a9a4b8', PIEDRA_OSC = '#827d94', PIEDRA_CLARA = '#c4bfd2';
function discoRunico(color) {
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  x.translate(256, 256); x.strokeStyle = '#fff'; x.fillStyle = '#fff'; x.lineCap = 'round';
  x.lineWidth = 10; x.beginPath(); x.arc(0, 0, 236, 0, Math.PI * 2); x.stroke();
  x.lineWidth = 5; x.beginPath(); x.arc(0, 0, 200, 0, Math.PI * 2); x.stroke();
  x.beginPath(); x.arc(0, 0, 70, 0, Math.PI * 2); x.stroke();
  x.lineWidth = 6; x.beginPath();
  for (let k = 0; k <= 5; k++) { const a = -Math.PI / 2 + k * Math.PI * 4 / 5; const px = Math.cos(a) * 196, py = Math.sin(a) * 196; k ? x.lineTo(px, py) : x.moveTo(px, py); }
  x.stroke();
  for (let k = 0; k < 12; k++) { // runas cuadradas entre los dos círculos
    const a = k / 12 * Math.PI * 2; x.save(); x.rotate(a); x.translate(0, -218);
    x.lineWidth = 4; x.strokeRect(-9, -9, 18, 18); if (k % 3 === 0) x.fillRect(-4, -4, 8, 8); x.restore();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.MeshBasicMaterial({ map: t, color, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
}
function ladrillo(ancho, alto, fondo, color, tetones = true) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(ancho, alto, fondo), plastico(color)); g.add(b);
  if (tetones) {
    const nx = Math.max(1, Math.round(ancho / 0.8)), nz = Math.max(1, Math.round(fondo / 0.8));
    for (let a = 0; a < nx; a++) for (let c = 0; c < nz; c++) {
      const t = new THREE.Mesh(TETON, plastico(color)); t.position.set((a - (nx - 1) / 2) * 0.8 * Math.min(1, ancho / (nx * 0.8)), alto / 2 + 0.085, (c - (nz - 1) / 2) * 0.8 * Math.min(1, fondo / (nz * 0.8))); g.add(t);
    }
  }
  return g;
}
function portal(color = '#7b5fd0', variante = 0) {
  const g = new THREE.Group();
  const runas = [];
  // tarima: tres capas de 12 lados, cada una algo más estrecha, con tetones en el borde
  [[2.55, PIEDRA, 18], [2.3, PIEDRA_OSC, 16], [2.05, '#5d5870', 0]].forEach(([rad, col, n], k) => {
    const capa = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, 0.32, 12), plastico(col));
    capa.position.y = 0.16 + k * 0.32; g.add(capa);
    for (let q = 0; q < n; q++) {
      const a = (q + 0.5) / n * Math.PI * 2; if (Math.abs(Math.atan2(Math.sin(a - Math.PI / 2), Math.cos(a - Math.PI / 2))) < 0.42) continue; // hueco de la escalinata
      const t = new THREE.Mesh(TETON, plastico(col)); t.position.set(Math.cos(a) * (rad - 0.18), 0.32 * (k + 1) + 0.085, Math.sin(a) * (rad - 0.18)); g.add(t);
    }
  });
  // disco rúnico encendido sobre la tarima
  const disco = new THREE.Mesh(new THREE.PlaneGeometry(3.9, 3.9), discoRunico(color));
  disco.rotation.x = -Math.PI / 2; disco.position.y = ALTO + 0.01; g.add(disco); runas.push(disco);
  // escalinata delantera
  [[0.32, 3.0], [0.64, 2.6]].forEach(([h, z]) => { const e = ladrillo(1.6, h, 0.42, PIEDRA, true); e.position.set(0, h / 2, z); g.add(e); });
  // piedras bajas con ojo rúnico alrededor
  for (let q = 0; q < 9; q++) {
    const a = q / 9 * Math.PI * 2 + 0.35; if (Math.abs(Math.atan2(Math.sin(a - Math.PI / 2), Math.cos(a - Math.PI / 2))) < 0.45) continue;
    const pz = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.38, 0.36, 6), plastico(PIEDRA_OSC)); pz.position.set(Math.cos(a) * 3.15, 0.18, Math.sin(a) * 3.15); g.add(pz);
    const ojo = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.05, 6), brillo(color, 1.6)); ojo.position.set(pz.position.x, 0.38, pz.position.z); g.add(ojo); runas.push(ojo);
  }
  // pilares de ladrillos 1x1 con tira de runas
  const pilar = (x, z, n, roto) => {
    const pg = new THREE.Group(); pg.position.set(x, 0, z); g.add(pg);
    const basa = ladrillo(1.0, 0.32, 1.0, PIEDRA_OSC, false); basa.position.y = 0.16; pg.add(basa);
    for (let k = 0; k < n; k++) {
      const b = ladrillo(0.78, 0.62, 0.78, k % 2 ? PIEDRA : PIEDRA_CLARA, k === n - 1);
      b.position.y = 0.32 + 0.31 + k * 0.64;
      if (roto && k === n - 1) { b.rotation.set(0.15, 0.4, 0.35); b.position.x += 0.12; }
      pg.add(b);
      if (!(roto && k === n - 1)) { const tira = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.36, 0.02), brillo(color, 1.4)); tira.position.set(0, b.position.y, 0.4); pg.add(tira); runas.push(tira); }
    }
    return 0.32 + n * 0.64;
  };
  const altoP = pilar(-1.45, -1.6, 7, false); pilar(1.45, -1.6, 7, variante === 2);
  pilar(-2.35, -0.35, 3, variante === 1); pilar(2.35, -0.35, 3, false);
  // arco de ladrillos entre los pilares altos (entero, o roto según la variante)
  const piezas = 9;
  for (let k = 0; k < piezas; k++) {
    if (variante === 2 && k > 5) continue;
    if (variante === 1 && k === 4) continue;
    const a = Math.PI * (k + 0.5) / piezas;
    const b = ladrillo(0.55, 0.42, 0.78, k % 2 ? PIEDRA : PIEDRA_CLARA, false);
    b.position.set(-Math.cos(a) * 1.45, altoP + Math.sin(a) * 1.1, -1.6); b.rotation.z = a - Math.PI / 2; g.add(b);
  }
  const clave = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.1, 6), brillo(color, 1.8)); clave.rotation.x = Math.PI / 2; clave.position.set(0, altoP + 1.1, -1.18);
  if (variante !== 2) { g.add(clave); runas.push(clave); }
  // resplandor del umbral
  const umbral = new THREE.Mesh(new THREE.PlaneGeometry(2.3, altoP - ALTO + 0.6), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  umbral.position.set(0, ALTO + (altoP - ALTO + 0.6) / 2, -1.62); g.add(umbral);
  // chispas flotantes del Portal
  for (let k = 0; k < 4; k++) {
    const ch = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), brillo(color, 2));
    ch.position.set((k - 1.5) * 0.9, 2.2 + (k % 2) * 1.3, -1.0 + (k % 3) * 0.5); g.add(flotar(ch, 0.35));
  }
  g.userData.runas = runas;
  return sombra(g);
}

// ---------- texturas impresas (cara y torso) ----------
function lienzo(w, h, pinta) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); pinta(x, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const NEGRO = '#1a1418';

// la cara se dibuja centrada en u = 0.5 (la cabeza gira 180° para que el centro mire al frente)
function cara(piel, opciones = {}) {
  const { ojos = 'abiertos', boca = 'sonrisa', barba = null, cejas = NEGRO, gafas = false, sombraTotal = false, mejillas = false, ojosBrillo = null } = opciones;
  return lienzo(512, 256, (x, w, h) => {
    x.fillStyle = sombraTotal ? '#0b0d1a' : piel; x.fillRect(0, 0, w, h);
    const cx = w / 2, oy = 108, sep = 34;
    x.lineCap = 'round';
    if (sombraTotal) {
      if (ojosBrillo) {
        x.shadowColor = ojosBrillo; x.shadowBlur = 18; x.fillStyle = ojosBrillo;
        for (const s of [-1, 1]) { x.beginPath(); x.ellipse(cx + s * sep, oy + 8, 9, 5, 0, 0, Math.PI * 2); x.fill(); }
        x.shadowBlur = 0;
      }
      return;
    }
    if (barba) {
      x.fillStyle = barba;
      x.beginPath(); x.moveTo(cx - 84, 70); x.lineTo(cx - 70, 70); x.quadraticCurveTo(cx - 66, 150, cx, 158); x.quadraticCurveTo(cx + 66, 150, cx + 70, 70); x.lineTo(cx + 84, 70);
      x.quadraticCurveTo(cx + 86, 226, cx, 240); x.quadraticCurveTo(cx - 86, 226, cx - 84, 70); x.fill();
      x.beginPath(); x.moveTo(cx - 44, 150); x.quadraticCurveTo(cx, 128, cx + 44, 150); x.quadraticCurveTo(cx, 146, cx - 44, 150); x.fill(); // bigote
      x.fillStyle = piel; x.beginPath(); x.ellipse(cx, 172, 20, 8, 0, 0, Math.PI * 2); x.fill();
      x.strokeStyle = NEGRO; x.lineWidth = 4; x.beginPath(); x.moveTo(cx - 12, 172); x.lineTo(cx + 12, 172); x.stroke();
    }
    x.strokeStyle = cejas; x.lineWidth = 7;
    for (const s of [-1, 1]) { x.beginPath(); x.moveTo(cx + s * (sep - 16), oy - 26); x.quadraticCurveTo(cx + s * sep, oy - 34, cx + s * (sep + 16), oy - 26); x.stroke(); }
    x.fillStyle = NEGRO; x.strokeStyle = NEGRO; x.lineWidth = 6;
    for (const s of [-1, 1]) {
      if (ojos === 'cerrados') { x.beginPath(); x.arc(cx + s * sep, oy - 2, 12, 0.15 * Math.PI, 0.85 * Math.PI); x.stroke(); }
      else {
        x.beginPath(); x.ellipse(cx + s * sep, oy, 8.5, 11, 0, 0, Math.PI * 2); x.fill();
        x.fillStyle = '#fff'; x.beginPath(); x.arc(cx + s * sep + 3, oy - 4, 3, 0, Math.PI * 2); x.fill(); x.fillStyle = NEGRO;
      }
    }
    if (gafas) {
      x.strokeStyle = '#3a2a22'; x.lineWidth = 5;
      for (const s of [-1, 1]) { x.beginPath(); x.arc(cx + s * sep, oy, 21, 0, Math.PI * 2); x.stroke(); }
      x.beginPath(); x.moveTo(cx - 13, oy - 2); x.lineTo(cx + 13, oy - 2); x.stroke();
    }
    if (mejillas) { x.fillStyle = 'rgba(235,110,110,.45)'; for (const s of [-1, 1]) { x.beginPath(); x.arc(cx + s * 62, oy + 30, 13, 0, Math.PI * 2); x.fill(); } }
    x.strokeStyle = NEGRO; x.lineWidth = 6;
    if (boca === 'sonrisa') { x.beginPath(); x.arc(cx, 132, 26, 0.2 * Math.PI, 0.8 * Math.PI); x.stroke(); }
    else if (boca === 'serena') { x.beginPath(); x.arc(cx, 128, 16, 0.25 * Math.PI, 0.75 * Math.PI); x.stroke(); }
    else if (boca === 'carcajada') {
      x.fillStyle = '#5a1a22'; x.beginPath(); x.moveTo(cx - 34, 130); x.quadraticCurveTo(cx, 186, cx + 34, 130); x.closePath(); x.fill();
      x.fillStyle = '#fff'; x.fillRect(cx - 26, 130, 52, 9);
    } else if (boca === 'firme' && !barba) { x.beginPath(); x.moveTo(cx - 16, 140); x.lineTo(cx + 16, 138); x.stroke(); }
  });
}

// torso: lienzo frontal; pinta(x, w, h) dibuja los detalles impresos
function torsoTex(color, pinta) {
  return lienzo(256, 256, (x, w, h) => { x.fillStyle = color; x.fillRect(0, 0, w, h); pinta && pinta(x, w, h); });
}
function gema(x, cx, cy, r, color) {
  x.fillStyle = '#e7c35a'; x.beginPath(); x.moveTo(cx, cy - r - 5); x.lineTo(cx + r + 5, cy); x.lineTo(cx, cy + r + 5); x.lineTo(cx - r - 5, cy); x.fill();
  x.fillStyle = color; x.beginPath(); x.moveTo(cx, cy - r); x.lineTo(cx + r, cy); x.lineTo(cx, cy + r); x.lineTo(cx - r, cy); x.fill();
  x.fillStyle = 'rgba(255,255,255,.7)'; x.beginPath(); x.arc(cx - r / 3, cy - r / 3, r / 4, 0, Math.PI * 2); x.fill();
}

// ---------- la figurita ----------
// Medidas aproximadas de un muñequito de bloques (unidades: 1 ≈ 1 cm de juguete ×2.5)
function trapecio(anchoArriba, anchoAbajo, alto, fondo) {
  const g = new THREE.BoxGeometry(anchoAbajo, alto, fondo);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) if (p.getY(i) > 0) p.setX(i, p.getX(i) * anchoArriba / anchoAbajo);
  g.computeVertexNormals();
  return g;
}

function figura(d) {
  const f = new THREE.Group();
  const piel = d.piel || '#f2c9a0';
  f.userData.piernas = []; f.userData.falda = !!d.falda;

  // piernas o falda
  if (d.falda) {
    const falda = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.95, 1.55, 4, 1), plastico(d.falda));
    falda.rotation.y = Math.PI / 4; falda.scale.z = 0.62; falda.position.y = 0.78;
    f.add(falda);
    if (d.faldaRibete) {
      const rib = new THREE.Mesh(new THREE.CylinderGeometry(0.97, 0.97, 0.12, 4, 1), plastico(d.faldaRibete));
      rib.rotation.y = Math.PI / 4; rib.scale.z = 0.62; rib.position.y = 0.06; f.add(rib);
    }
  } else {
    const cadera = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.28, 0.62), plastico(d.cadera || d.piernas[0]));
    cadera.position.y = 1.45; f.add(cadera);
    d.piernas.forEach((c, i) => {
      const s = i === 0 ? -1 : 1;
      const pierna = new THREE.Group();
      const muslo = new THREE.Mesh(new THREE.BoxGeometry(0.58, 1.05, 0.62), plastico(c));
      muslo.position.y = -0.55; pierna.add(muslo);
      const pie = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.32, 0.78), plastico(d.botas || c));
      pie.position.set(0, -1.15, 0.08); pierna.add(pie);
      if (d.botas) { const caña = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.45, 0.64), plastico(d.botas)); caña.position.y = -0.85; pierna.add(caña); }
      pierna.position.set(s * 0.31, 1.32, 0);
      pierna.rotation.x = (d.paso || 0) * s;
      f.add(pierna); f.userData.piernas.push(pierna); pierna.userData.base = pierna.rotation.x;
    });
  }

  // torso con estampado
  const tt = torsoTex(d.torso, d.estampado);
  const matTorso = [plastico(d.torso), plastico(d.torso), plastico(d.torso), plastico(d.torso), plastico('#ffffff', { map: tt }), plastico(d.torso)];
  const torso = new THREE.Mesh(trapecio(0.95, 1.3, 1.3, 0.62), matTorso);
  torso.position.y = 2.25; f.add(torso);

  // brazos y manos en C
  const hombroY = 2.72;
  [-1, 1].forEach(s => {
    const brazo = new THREE.Group();
    const color = (s < 0 ? d.brazoIzq : d.brazoDer) || d.brazos || d.torso;
    const sup = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.23, 0.95, 16), plastico(color, color === '#9aa3ad' ? { metalness: 0.7, roughness: 0.25 } : {}));
    sup.position.y = -0.45; brazo.add(sup);
    const hombro = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12), plastico(color)); brazo.add(hombro);
    const puno = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.14, 16), plastico(d.puños || color)); puno.position.y = -0.95; brazo.add(puno);
    const mano = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.08, 10, 18, Math.PI * 1.45), plastico(d.manos || piel));
    mano.rotation.set(0, Math.PI / 2, Math.PI * 0.77); mano.position.y = -1.13; brazo.add(mano);
    brazo.position.set(s * 0.6, hombroY, 0);
    const pose = (s < 0 ? d.poseIzq : d.poseDer) || [0.25, 0.12];
    brazo.rotation.x = -pose[0];
    brazo.rotation.z = s * pose[1];
    brazo.userData.mano = mano; brazo.userData.base = [brazo.rotation.x, brazo.rotation.z];
    f.add(brazo);
    f.userData[s < 0 ? 'brazoIzq' : 'brazoDer'] = brazo;
  });

  // cuello y cabeza
  const cuello = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.12, 16), plastico(piel)); cuello.position.y = 2.96; f.add(cuello);
  const cabeza = new THREE.Group(); cabeza.position.y = 3.45; f.add(cabeza);
  const caraMat = plastico('#ffffff', { map: cara(piel, d.cara) });
  const craneo = new THREE.Mesh(new THREE.CylinderGeometry(0.43, 0.43, 0.82, 40, 1), [caraMat, plastico(d.cara?.sombraTotal ? '#0b0d1a' : piel), plastico(piel)]);
  craneo.rotation.y = Math.PI; cabeza.add(craneo);
  for (const y of [0.41, -0.41]) { const bisel = new THREE.Mesh(new THREE.TorusGeometry(0.39, 0.05, 8, 40), plastico(piel)); bisel.rotation.x = Math.PI / 2; bisel.position.y = y; cabeza.add(bisel); }
  const tet = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.16, 6), plastico(piel)); tet.position.y = 0.5; cabeza.add(tet);

  if (d.pelo) cabeza.add(d.pelo());
  if (d.capa) f.add(capa(d.capa, d.capaLarga));
  if (d.extra) d.extra(f, cabeza);
  f.userData.cabeza = cabeza;
  return sombra(f);
}

// capa: lámina doblada a la espalda
function capa(color, larga = 2.3) {
  const g = new THREE.Group();
  const forma = new THREE.Shape();
  forma.moveTo(-0.5, 0); forma.lineTo(0.5, 0); forma.lineTo(0.85, -larga); forma.lineTo(-0.85, -larga); forma.closePath();
  const geo = new THREE.ExtrudeGeometry(forma, { depth: 0.06, bevelEnabled: false });
  const m = new THREE.Mesh(geo, plastico(color, { side: THREE.DoubleSide }));
  m.position.set(0, 2.9, -0.37); m.rotation.x = 0.1;
  g.add(m);
  return g;
}

// ---------- piezas de pelo y sombreros ----------
function peloMelena(color, largo = 1.0, flequillo = true) {
  return () => {
    const g = new THREE.Group(); const mt = plastico(color);
    const casco = new THREE.Mesh(new THREE.SphereGeometry(0.52, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5), mt); casco.position.y = 0.24; casco.scale.set(1, 1.05, 1); g.add(casco);
    const trasera = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.62, largo, 32, 1, true, Math.PI * 0.3, Math.PI * 1.4), plastico(color, { side: THREE.DoubleSide }));
    trasera.position.y = 0.26 - largo / 2; g.add(trasera);
    for (const s of [-1, 1]) { const mech = new THREE.Mesh(new THREE.BoxGeometry(0.16, largo * 0.85, 0.3), mt); mech.position.set(s * 0.47, 0.26 - largo * 0.45, 0.22); mech.rotation.z = s * -0.08; g.add(mech); }
    if (flequillo) { const f = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.16, 0.2), mt); f.position.set(0, 0.36, 0.38); f.rotation.x = -0.35; g.add(f); }
    return g;
  };
}
function peloCorto(color, despeinado = true) {
  return () => {
    const g = new THREE.Group(); const mt = plastico(color);
    const casco = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5), mt); casco.position.y = 0.27; casco.scale.y = 0.9; g.add(casco);
    const nuca = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.5, 32, 1, true, Math.PI * 0.42, Math.PI * 1.16), plastico(color, { side: THREE.DoubleSide })); nuca.position.y = 0.1; g.add(nuca);
    if (despeinado) for (let k = 0; k < 5; k++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10), mt);
      const a = -0.9 + k * 0.45; m.position.set(Math.sin(a) * 0.3, 0.62 - Math.abs(a) * 0.05, Math.cos(a) * 0.2 + 0.08); m.scale.set(1.2, 0.6, 1); m.rotation.z = -a * 0.5; g.add(m);
    }
    return g;
  };
}
function capucha(color, forro = '#0b0d1a', pico = true) {
  return () => {
    const g = new THREE.Group();
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.64, 32, 20, Math.PI * 0.78, Math.PI * 1.44, 0, Math.PI * 0.78), plastico(color, { side: THREE.DoubleSide }));
    c.position.y = 0.05;
    const frente = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 20, 0, Math.PI * 2, 0, Math.PI * 0.2), plastico(color)); frente.position.y = 0.05; frente.scale.set(1, 1.15, 1); g.add(frente); c.scale.set(1, 1.15, 1); g.add(c);
        if (pico) { const p = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.45, 16), plastico(color)); p.position.set(0, 0.62, -0.12); p.rotation.x = -0.5; g.add(p); }
    const cuelloC = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.72, 0.28, 32), plastico(color)); cuelloC.position.y = -0.58; g.add(cuelloC);
    return g;
  };
}

function humo(f, color, op) {
  for (let k = 0; k < 9; k++) {
    const r = new THREE.Mesh(new THREE.TorusGeometry(0.25 + 0.05 * (k % 3), 0.06, 8, 20, Math.PI * 1.2), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.9, transparent: true, opacity: op * 0.6 }));
    const a = k / 9 * Math.PI * 2;
    r.position.set(Math.cos(a) * 1.25, 1.2 + (k % 4) * 0.7, Math.sin(a) * 0.6 - 0.1);
    r.rotation.set(a, a * 2, a);
    f.add(r);
  }
}

const vertical = () => innerWidth < innerHeight;

const NOMBRES = { clarividente: 'Clarividente', cronomante: 'Cronomante', centinela: 'Centinela', ocultista: 'Ocultista', entusiasta: 'Entusiasta', estratega: 'Estratega', cronista: 'Cronista' };
const COLOR_RUNA = { clarividente: '#5ff2e6', cronomante: '#57c8ff', centinela: '#e8473a', ocultista: '#7fc6ff', entusiasta: '#f2c230', estratega: '#ff8f3a', cronista: '#b48aff' };
const orden = (params.get('quien') || 'clarividente,cronomante,centinela,ocultista,entusiasta,estratega,cronista').split(',').filter(n => PERSONAJES[n]);
const puestos = [];
const sep = Number(params.get('sep') || 6.6);
orden.forEach((n, i) => {
  const g = new THREE.Group();
  const p = portal(COLOR_RUNA[n], i % 3);
  g.add(p);
  const fig = PERSONAJES[n](); fig.position.y = ALTO; g.add(fig);
  // anillo mágico para la habilidad
  const anillo = new THREE.Mesh(new THREE.TorusGeometry(1, 0.06, 8, 48), brillo(COLOR_RUNA[n], 2));
  anillo.rotation.x = Math.PI / 2; anillo.visible = false; g.add(anillo); anillo.userData.y0 = ALTO;
  const cols = Math.min(vertical() ? 3 : 4, orden.length), filas = Math.ceil(orden.length / cols);
  g.position.x = (i % cols - (cols - 1) / 2) * sep;
  g.position.z = (Math.floor(i / cols) - (filas - 1) / 2) * sep * 1.45;
  escena.add(g);
  fig.traverse(o => o.userData.puesto = i);
  puestos.push({ id: n, g, fig, anillo, anim: 'reposo', t0: 0 });
});

// ---------- animaciones ----------
const ANIMACIONES = { reposo: 'Reposo', andar: 'Andar', saludar: 'Saludar', habilidad: 'Habilidad' };
function brazos(f, fn) { ['brazoIzq', 'brazoDer'].forEach((k, i) => { const b = f.userData[k]; const [rx, rz] = b.userData.base; fn(b, rx, rz, i === 0 ? -1 : 1); }); }
function animar(P, t, T) {
  const { fig: f, anillo } = P;
  const cab = f.userData.cabeza;
  // valores de reposo
  f.position.set(0, ALTO, 0); f.rotation.set(0, 0, 0); anillo.visible = false;
  f.userData.piernas.forEach(p => p.rotation.x = p.userData.base);
  brazos(f, (b, rx, rz) => { b.rotation.x = rx; b.rotation.z = rz; });
  cab.rotation.set(0, 0, 0);
  if (P.anim === 'reposo') {
    cab.rotation.y = Math.sin(T * 0.8 + P.g.position.x) * 0.25;
    f.position.y = ALTO + Math.abs(Math.sin(T * 1.6)) * 0.03;
    brazos(f, (b, rx, rz, s) => { b.rotation.x = rx + Math.sin(T * 1.6 + s) * 0.06; });
  } else if (P.anim === 'andar') {
    // baja del Portal, da una vuelta y vuelve a subir
    const R = 3.4, w = 0.7, th = (t * w) % (Math.PI * 2);
    const x = Math.sin(th) * R, z = R - Math.cos(th) * R;
    const dc = Math.hypot(x, z); // sobre la tarima, bajando la escalinata o en el suelo
    f.position.set(x, dc < 2.0 ? ALTO : dc > 3.25 ? 0.02 : ALTO * (3.25 - dc) / 1.25, z);
    f.rotation.y = Math.PI / 2 - th;
    const fase = t * 9;
    f.userData.piernas.forEach((p, i) => p.rotation.x = Math.sin(fase + i * Math.PI) * 0.55);
    brazos(f, (b, rx, rz, s) => { b.rotation.x = rx + Math.sin(fase + (s < 0 ? 0 : Math.PI)) * 0.45; });
    f.position.y += Math.abs(Math.sin(fase)) * 0.12;
    if (f.userData.falda) f.rotation.z = Math.sin(fase) * 0.07;
    cab.rotation.y = Math.sin(fase / 2) * 0.1;
  } else if (P.anim === 'saludar') {
    const b = f.userData.brazoDer;
    b.rotation.x = -2.7; b.rotation.z = 0.35 + Math.sin(t * 9) * 0.35;
    cab.rotation.z = -0.12; cab.rotation.y = Math.sin(t * 2) * 0.15;
    f.position.y = ALTO + Math.abs(Math.sin(t * 4.5)) * 0.08;
  } else if (P.anim === 'alzar') { // invocando: brazos al cielo
    brazos(f, (b, rx, rz, s) => { b.rotation.x = -2.8 + Math.sin(t * 6 + s) * 0.08; b.rotation.z = s * 0.25; });
    cab.rotation.x = -0.25; f.position.y = ALTO + Math.min(1, t) * 0.25 + Math.sin(t * 3) * 0.05;
  } else if (P.anim === 'celebrar') { // recibe su Gema: dos saltitos de alegría
    if (t > 1.3) { P.anim = 'reposo'; return; }
    f.position.y = ALTO + Math.abs(Math.sin(t * Math.PI * 1.55)) * 0.7;
    brazos(f, (b, rx, rz, s) => { b.rotation.x = -2.6; b.rotation.z = s * (0.5 + Math.sin(t * 12) * 0.15); });
  } else if (P.anim === 'habilidad') {
    const c = t % 2.6;
    if (c < 1.1) { // salto con giro y brazos arriba
      const k = c / 1.1;
      f.position.y = ALTO + Math.sin(k * Math.PI) * 1.2;
      f.rotation.y = k * Math.PI * 2;
      brazos(f, (b, rx, rz, s) => { b.rotation.x = -2.9 * Math.sin(k * Math.PI) + rx * (1 - Math.sin(k * Math.PI)); b.rotation.z = s * 0.4; });
    } else { // lanza la magia
      const k = (c - 1.1) / 1.5;
      brazos(f, (b, rx, rz, s) => { b.rotation.x = -1.5; b.rotation.z = s * (0.2 + 0.3 * Math.sin(k * Math.PI)); });
      anillo.visible = true; anillo.position.y = ALTO + 0.1 + k * 1.5; anillo.scale.setScalar(0.6 + k * 2.4);
      anillo.material.opacity = 1 - k;
    }
  }
}

// ---------- invocación de Baelorith (Estratega + Cronomante + Cronista) ----------
const INVOCACION = { criatura: 'Baelorith', need: ['estratega', 'cronomante', 'cronista'], gemas: 5, color: '#e8284a', color2: '#ffb0c0' };
const filasGrid = Math.max(...puestos.map(P => P.g.position.z));
const SITIO = new THREE.Vector3(0, 0, filasGrid + 9.5);
const CIELO = SITIO.clone().add(new THREE.Vector3(0, 9, 0));

// Partículas: tetones y placas sueltas que vuelan (confeti de bloques)
const PIEZA_CHISPA = new THREE.CylinderGeometry(0.12, 0.12, 0.08, 6);
const particulas = [];
function chispa(pos, color, { vel = new THREE.Vector3(), vida = 1, grav = 0, hacia = null, arco = 0, tam = 1 } = {}) {
  const m = new THREE.Mesh(PIEZA_CHISPA, new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1.2, transparent: true, roughness: 0.3 }));
  m.position.copy(pos); m.scale.setScalar(tam); m.rotation.set(Math.random() * 6, Math.random() * 6, 0);
  escena.add(m); particulas.push({ m, vel, vida, t: 0, grav, desde: pos.clone(), hacia, arco });
}
function moverParticulas(dt) {
  for (let i = particulas.length - 1; i >= 0; i--) {
    const q = particulas[i]; q.t += dt; const k = q.t / q.vida;
    if (k >= 1) { escena.remove(q.m); q.m.material.dispose(); particulas.splice(i, 1); continue; }
    if (q.hacia) { q.m.position.lerpVectors(q.desde, q.hacia, k); q.m.position.y += Math.sin(k * Math.PI) * q.arco; }
    else { q.vel.y -= q.grav * dt; q.m.position.addScaledVector(q.vel, dt); }
    q.m.rotation.x += dt * 4; q.m.rotation.y += dt * 3;
    q.m.material.opacity = Math.min(1, (1 - k) * 2);
  }
}
const azar = (a) => (Math.random() - 0.5) * a;
function estallido(pos, colores, n, fuerza = 4, grav = 6) {
  for (let i = 0; i < n; i++) chispa(pos, colores[i % colores.length], { vel: new THREE.Vector3(azar(2), Math.random(), azar(2)).normalize().multiplyScalar(fuerza * (0.5 + Math.random())), vida: 1 + Math.random(), grav });
}

// La criatura, construida con bloques: cristal carmesí, corona de púas, hombreras, espada y manto
function criaturaBloques() {
  const g = new THREE.Group();
  const cuerpo = plastico('#c8203e', { emissive: '#5a0010', emissiveIntensity: 0.5 });
  const claro = plastico('#ffb0c0', { emissive: '#ff6a8a', emissiveIntensity: 0.6 });
  const oscuro = plastico('#7a1022', { emissive: '#30000a', emissiveIntensity: 0.4 });
  const cristal = new THREE.MeshStandardMaterial({ color: '#ff8aa4', emissive: '#d8284a', emissiveIntensity: 0.9, transparent: true, opacity: 0.8, roughness: 0.1, flatShading: true });
  const add = (geo, mat, x, y, z, padre = g) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); padre.add(m); return m; };
  // piernas que acaban en punta (flota)
  for (const s of [-1, 1]) { const pi = add(new THREE.CylinderGeometry(0.45, 0.1, 3.2, 4), cuerpo, s * 0.55, 2.0, 0); pi.rotation.y = Math.PI / 4; }
  add(new THREE.BoxGeometry(2.0, 0.5, 1.0), oscuro, 0, 3.7, 0);
  // torso trapezoidal con cristales incrustados
  const torso = add(trapecio(1.6, 2.8, 2.6, 1.2), cuerpo, 0, 5.2, 0);
  for (const [x, y] of [[0, 5.4], [-0.55, 5.9], [0.55, 5.9], [0, 4.5]]) add(new THREE.OctahedronGeometry(0.28), cristal, x, y, 0.62).scale.set(1, 1.5, 0.6);
  // hombreras de púas
  for (const s of [-1, 1]) for (let i = 0; i < 3; i++) { const c = add(new THREE.ConeGeometry(0.28, 1.3 - i * 0.25, 4), i ? oscuro : cuerpo, s * (1.5 + i * 0.3), 6.6 - i * 0.15, 0); c.rotation.z = -s * (0.4 + i * 0.4); }
  // brazos abiertos con manos en C
  const brazos = [];
  for (const s of [-1, 1]) {
    const b = new THREE.Group(); b.position.set(s * 1.55, 6.2, 0); g.add(b); brazos.push(b);
    add(new THREE.CylinderGeometry(0.3, 0.24, 2.6, 4), cuerpo, 0, -1.3, 0, b).rotation.y = Math.PI / 4;
    const mano = add(new THREE.TorusGeometry(0.35, 0.16, 8, 12, Math.PI * 1.45), claro, 0, -2.75, 0, b); mano.rotation.set(0, Math.PI / 2, Math.PI * 0.77);
    b.rotation.z = s * 0.7; b.rotation.x = -0.4;
  }
  // cabeza sin rostro: prisma hexagonal con gema y corona de púas
  add(new THREE.CylinderGeometry(0.3, 0.3, 0.3, 6), oscuro, 0, 6.65, 0);
  const cab = add(new THREE.CylinderGeometry(0.7, 0.7, 1.2, 6), claro, 0, 7.4, 0);
  add(new THREE.OctahedronGeometry(0.22), cristal, 0, 7.55, 0.66);
  add(new THREE.ConeGeometry(0.22, 2.0, 4), cuerpo, 0, 8.9, 0);
  for (const s of [-1, 1]) for (let i = 0; i < 3; i++) { const c = add(new THREE.ConeGeometry(0.16, 1.4 - i * 0.3, 4), i ? oscuro : cuerpo, s * (0.25 + i * 0.25), 8.4 - i * 0.12, 0); c.rotation.z = -s * (0.35 + i * 0.35); }
  // espada clavada delante
  const esp = new THREE.Group(); esp.position.set(0, 0, 1.4); g.add(esp);
  add(new THREE.BoxGeometry(0.28, 3.6, 0.1), cristal, 0, 2.2, 0, esp);
  add(new THREE.ConeGeometry(0.2, 0.6, 4), cristal, 0, 0.1, 0, esp).rotation.x = Math.PI;
  add(new THREE.BoxGeometry(1.4, 0.22, 0.3), oscuro, 0, 4.05, 0, esp);
  add(new THREE.BoxGeometry(0.22, 0.9, 0.22), oscuro, 0, 4.6, 0, esp);
  add(new THREE.OctahedronGeometry(0.22), cristal, 0, 5.2, 0, esp);
  // manto de dos alas
  for (const s of [-1, 1]) {
    const forma = new THREE.Shape(); forma.moveTo(0, 0); forma.lineTo(s * 1.0, 0); forma.lineTo(s * 2.6, -5.2); forma.lineTo(s * 0.2, -5.6); forma.closePath();
    const ala = add(new THREE.ExtrudeGeometry(forma, { depth: 0.08, bevelEnabled: false }), new THREE.MeshStandardMaterial({ color: '#d8284a', emissive: '#6a0018', emissiveIntensity: 0.5, transparent: true, opacity: 0.85, side: THREE.DoubleSide }), s * 0.3, 6.5, -0.7);
    ala.rotation.x = 0.18;
  }
  // cristales flotando alrededor
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; const c = add(new THREE.OctahedronGeometry(0.2), cristal, Math.cos(a) * 2.6, 2.5 + (i % 4) * 1.3, Math.sin(a) * 1.4); c.scale.y = 1.6; flotar(c, 0.25); }
  g.userData.brazos = brazos;
  const mats = []; g.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; o.material.userData.op = o.material.opacity; mats.push(o.material); o.castShadow = true; } });
  g.userData.mats = mats;
  return g;
}
function opacidadDe(g, k) { for (const m of g.userData.mats) m.opacity = m.userData.op * k; }

function gemaBloque(color) {
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.42), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.7, roughness: 0.15, flatShading: true }));
  m.scale.set(1.5, 2, 1.5); g.add(m);
  const halo = new THREE.PointLight(color, 2, 3); g.add(halo);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.1, 6), plastico('#e2b453')); base.position.y = -0.5; g.add(base);
  return sombra(g);
}

const INV = { activo: false, t: 0 }; window.INV = INV;
let granCirculo = null, criatura = null, gemas = [], nuevoPortal = null, pila = 0;
const narrar = (texto) => { titulo.lastChild.textContent = texto; };
function limpiarInvocacion() {
  [granCirculo, criatura, nuevoPortal, ...gemas].forEach(o => o && escena.remove(o));
  granCirculo = criatura = nuevoPortal = null; gemas = [];
}
function empezarInvocacion() {
  limpiarInvocacion(); elegir(-1);
  INV.activo = true; INV.t = 0; INV.hechos = new Set();
  INV.req = puestos.filter(P => INVOCACION.need.includes(P.id));
  titulo.firstChild.textContent = 'Invocación';
  destino = { pos: new THREE.Vector3(0, 3, (SITIO.z + filasGrid) / 2 + 1), dist: vertical() ? 74 : 36 };
}
const una = (clave, fn) => { if (!INV.hechos.has(clave)) { INV.hechos.add(clave); fn(); } };
const suave = (k) => k * k * (3 - 2 * k), limita = (k) => Math.max(0, Math.min(1, k));
function manoDe(P) { return P.fig.userData.brazoDer.userData.mano.getWorldPosition(new THREE.Vector3()); }

function pasoInvocacion(dt) {
  const t = (INV.t += dt);
  const T = reloj.getElapsedTime();
  // 1. Los requeridos alzan su magia; las runas de su Portal despiertan
  una('inicio', () => {
    narrar('Estratega, Cronomante y Cronista están en Portales distintos: las runas despiertan…');
    INV.req.forEach(P => { P.anim = 'alzar'; P.t0 = T; });
    granCirculo = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), discoRunico(INVOCACION.color));
    granCirculo.rotation.x = -Math.PI / 2; granCirculo.position.copy(SITIO).setY(0.12); granCirculo.scale.setScalar(0.01); escena.add(granCirculo);
  });
  if (t < 4.2) {
    granCirculo.scale.setScalar(suave(limita(t / 2.5)) * 10);
    granCirculo.rotation.z = t * 0.4;
    if (Math.random() < 0.9) INV.req.forEach(P => chispa(manoDe(P), COLOR_RUNA[P.id], { hacia: CIELO, vida: 1.1, arco: 3, tam: 1.2 }));
    if (t > 1.5) una('funde', () => narrar('…y funden su magia en el cielo.'));
  }
  // 2. Estallido: la criatura cruza el umbral desde el suelo
  if (t >= 4.2) una('boom', () => {
    narrar('¡Baelorith cruza el umbral!');
    estallido(CIELO, [INVOCACION.color, INVOCACION.color2, '#ffffff'], 70, 7, 5);
    INV.req.forEach(P => { P.anim = 'reposo'; });
    criatura = criaturaBloques(); criatura.position.copy(SITIO).setY(-9); escena.add(criatura); opacidadDe(criatura, 0);
    INV.temblor = 0.8;
  });
  if (criatura && t < 12.5) {
    const k = suave(limita((t - 4.2) / 2.6));
    criatura.position.y = -9 + k * 9.5 + (k >= 1 ? Math.sin(T * 1.2) * 0.2 : 0);
    opacidadDe(criatura, Math.min(1, k * 1.6));
    criatura.rotation.y = Math.sin(T * 0.5) * 0.15;
    if (t < 7 && Math.random() < 0.7) chispa(SITIO.clone().add(new THREE.Vector3(azar(6), 0.3, azar(3))), INVOCACION.color, { vel: new THREE.Vector3(0, 3 + Math.random() * 2, 0), vida: 1.2 });
  }
  granCirculo.rotation.z += dt * (t < 12.5 ? 0.3 : 1.2);
  // 3. Ofrece sus Gemas: orbitan a su alrededor
  const C = SITIO.clone().add(new THREE.Vector3(0, 6.3, 1.4));
  if (t >= 7.2) una('gemas', () => {
    narrar('En agradecimiento, ofrece sus Gemas a quienes la invocaron.');
    for (let i = 0; i < INVOCACION.gemas; i++) { const gm = gemaBloque(INVOCACION.color); gm.position.copy(C); escena.add(gm); gemas.push(gm); gm.userData.an = i / INVOCACION.gemas * Math.PI * 2; gm.userData.orbita = true; }
    criatura.userData.brazos.forEach((b, i) => b.rotation.x = -1.1);
  });
  const radio = 2.6 * suave(limita((t - 7.2) / 1));
  gemas.forEach(gm => {
    gm.rotation.y += dt * 2.5;
    if (gm.userData.orbita) { gm.userData.an += dt * 1.4; gm.position.set(C.x + Math.cos(gm.userData.an) * radio, C.y + Math.sin(gm.userData.an * 2 + T) * 0.25, C.z + Math.sin(gm.userData.an) * radio * 0.6); }
  });
  // 4. Reparto: una Gema vuela a cada requerido único en el Portal de un jugador
  INV.req.forEach((P, i) => {
    const t0 = 9.2 + i * 1.5, gm = gemas[i];
    if (!gm || t < t0) return;
    una('vuela' + i, () => { gm.userData.orbita = false; gm.userData.desde = gm.position.clone(); narrar(`Una Gema para ${NOMBRES[P.id]}…`); });
    const destinoG = P.g.position.clone().add(new THREE.Vector3(0, ALTO + 5.2, 0.4));
    const pilaG = P.g.position.clone().add(new THREE.Vector3(1.0, 0.75, 3.4)); // delante, junto a la escalinata
    const k = limita((t - t0) / 1.2);
    if (k < 1) { gm.position.lerpVectors(gm.userData.desde, destinoG, suave(k)); gm.position.y += Math.sin(k * Math.PI) * 4; }
    else {
      una('llega' + i, () => { P.anim = 'celebrar'; P.t0 = T; estallido(destinoG, [INVOCACION.color, '#ffffff', '#ffd86a'], 26, 3, 4); });
      const k2 = suave(limita((t - t0 - 1.2) / 0.7)); gm.position.lerpVectors(destinoG, pilaG, k2); gm.position.y += Math.sin(k2 * Math.PI) * 1.2;
      if (k2 >= 1) una('apila' + i, () => estallido(pilaG, ['#ffd86a', INVOCACION.color], 10, 1.5, 4));
    }
  });
  // 5. Las Gemas que sobran vuelven con la criatura
  if (t >= 14.2) {
    una('sobran', () => { narrar('Las Gemas que nadie recibe se van con la criatura.'); gemas.slice(INV.req.length).forEach(gm => { gm.userData.orbita = false; gm.userData.desde = gm.position.clone(); }); });
    gemas.slice(INV.req.length).forEach((gm, i) => { const k = limita((t - 14.2 - i * 0.2) / 0.8); gm.position.lerpVectors(gm.userData.desde, SITIO.clone().add(new THREE.Vector3(0, 5.2, 0.6)), suave(k)); gm.scale.setScalar(1 - k * 0.9); gm.visible = k < 1; });
  }
  // 6. La criatura parte; el círculo se encoge y queda como la runa del nuevo Portal
  if (t >= 15.4 && criatura) {
    una('parte', () => narrar('Baelorith parte. Su círculo deja la marca en el suelo y se encoge…'));
    const k = limita((t - 15.4) / 2);
    criatura.position.y = 0.5 + suave(k) * 6; opacidadDe(criatura, 1 - k); criatura.scale.setScalar(1 - k * 0.4);
    if (Math.random() < 0.8) chispa(criatura.position.clone().add(new THREE.Vector3(azar(4), 3 + Math.random() * 5, azar(2))), INVOCACION.color2, { vel: new THREE.Vector3(0, 3, 0), vida: 1 });
    if (k >= 1) { escena.remove(criatura); criatura = null; }
  }
  if (t >= 16.4 && t < 18.4) granCirculo.scale.setScalar(10 - suave((t - 16.4) / 2) * (10 - 3.9));
  // 7. El nuevo Portal central se monta pieza a pieza alrededor de la runa
  if (t >= 18.4) {
    una('portal', () => {
      narrar('…y el nuevo Portal central se construye a su alrededor, pieza a pieza.');
      nuevoPortal = portal(INVOCACION.color, 0); nuevoPortal.position.copy(SITIO); escena.add(nuevoPortal);
      nuevoPortal.userData.runas[0].visible = false; // la runa es el propio círculo de la invocación
      const piezas = [];
      nuevoPortal.traverse(o => { if (o !== nuevoPortal && o.parent === nuevoPortal) piezas.push(o); });
      piezas.forEach(o => {
        const y = new THREE.Box3().setFromObject(o).min.y - SITIO.y;
        o.userData.fin = { p: o.position.clone(), r: o.rotation.clone() };
        o.userData.ini = { p: o.position.clone().add(new THREE.Vector3(azar(10), 9 + Math.random() * 6, azar(10))), r: new THREE.Euler(azar(6), azar(6), azar(6)) };
        o.userData.retraso = Math.min(2.6, y * 0.32) + Math.random() * 0.35;
        o.visible = false;
      });
      INV.piezas = piezas;
    });
    const tp = t - 18.4;
    INV.piezas.forEach(o => {
      if (o.userData.flota) return; // las chispas del Portal flotan por su cuenta
      const k = limita((tp - o.userData.retraso) / 0.65), { ini, fin } = o.userData;
      o.visible = k > 0;
      const e = 1 - Math.pow(1 - k, 3);
      o.position.lerpVectors(ini.p, fin.p, e);
      o.rotation.set(ini.r.x + (fin.r.x - ini.r.x) * e, ini.r.y + (fin.r.y - ini.r.y) * e, ini.r.z + (fin.r.z - ini.r.z) * e);
      if (k >= 1 && !o.userData.encajado) { o.userData.encajado = true; pila++; if (pila % 3 === 0) estallido(SITIO.clone().add(fin.p).setY(fin.p.y + 0.2), ['#c4bfd2', '#a9a4b8'], 3, 1.5, 6); }
    });
    // la runa sube con la tarima
    granCirculo.position.y = 0.12 + suave(limita((tp - 0.4) / 1.4)) * (ALTO - 0.11);
    if (tp > 3.6) una('enciende', () => { narrar('¡Nuevo Portal central!'); estallido(SITIO.clone().setY(ALTO + 0.3), [INVOCACION.color, '#ffffff'], 40, 5, 5); INV.temblor = 0.3; });
    if (tp > 5.5) { INV.activo = false; titulo.firstChild.textContent = 'Todos'; narrar('Desliza para girar · pellizca para acercar · toca un personaje para verlo solo'); }
  }
}

// ---------- cámara (cenital 3/4) y gestos ----------
const distGeneral = () => vertical() ? 78 : 40;
let ang = Number(params.get('ang') || 0), alt = Number(params.get('alt') || 0.6), dist = Number(params.get('dist') || distGeneral());
const objetivo = new THREE.Vector3(0, Number(params.get('y') || 1.6), 0);
let destino = null; // { pos, dist }
function colocarCamara() {
  if (destino) {
    const k = 1 - Math.exp(-dtCam * 5);
    objetivo.lerp(destino.pos, k); dist += (destino.dist - dist) * k;
    if (objetivo.distanceTo(destino.pos) < 0.01 && Math.abs(destino.dist - dist) < 0.05) destino = null;
  }
  camara.position.set(objetivo.x + Math.sin(ang) * Math.cos(alt) * dist, objetivo.y + Math.sin(alt) * dist, objetivo.z + Math.cos(ang) * Math.cos(alt) * dist);
  camara.lookAt(objetivo);
  if (INV.temblor > 0) { INV.temblor = Math.max(0, INV.temblor - dtCam); const a = INV.temblor * 0.6; camara.position.add(new THREE.Vector3(azar(a), azar(a), azar(a))); }
}
const punteros = new Map();
let pellizco = null, movido = 0;
const lienzoEl = renderer.domElement;
lienzoEl.addEventListener('pointerdown', e => { lienzoEl.setPointerCapture(e.pointerId); punteros.set(e.pointerId, [e.clientX, e.clientY]); movido = 0; pellizco = null; });
lienzoEl.addEventListener('pointermove', e => {
  if (!punteros.has(e.pointerId)) return;
  const prev = punteros.get(e.pointerId); punteros.set(e.pointerId, [e.clientX, e.clientY]);
  if (punteros.size === 1) {
    const dx = e.clientX - prev[0], dy = e.clientY - prev[1]; movido += Math.abs(dx) + Math.abs(dy);
    ang -= dx * 0.007; alt = Math.min(1.45, Math.max(0.08, alt + dy * 0.005));
  } else if (punteros.size === 2) {
    const [a, b] = [...punteros.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pellizco) { dist = Math.min(70, Math.max(5, dist * pellizco / d)); destino = null; }
    pellizco = d; movido += 99;
  }
});
function soltar(e) {
  if (punteros.size === 1 && movido < 8) tocar(e.clientX, e.clientY);
  punteros.delete(e.pointerId); pellizco = null;
}
lienzoEl.addEventListener('pointerup', soltar);
lienzoEl.addEventListener('pointercancel', e => { punteros.delete(e.pointerId); pellizco = null; });
lienzoEl.addEventListener('wheel', e => { e.preventDefault(); destino = null; dist = Math.min(70, Math.max(5, dist * (1 + e.deltaY * 0.001))); }, { passive: false });
addEventListener('resize', () => { camara.aspect = innerWidth / innerHeight; camara.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const rayo = new THREE.Raycaster();
function tocar(x, y) {
  rayo.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), camara);
  const hit = rayo.intersectObjects(puestos.map(p => p.g), true).find(h => h.object.userData.puesto !== undefined);
  if (hit) elegir(hit.object.userData.puesto);
}

// ---------- panel ----------
let elegido = -1; // -1 = todos
const filaP = document.getElementById('filaPersonajes'), filaA = document.getElementById('filaAnimaciones');
const titulo = document.getElementById('titulo');
function boton(fila, texto, fn, clase = '') { const b = document.createElement('button'); b.textContent = texto; b.className = clase; b.onclick = fn; fila.appendChild(b); return b; }
boton(filaP, '‹', () => elegir(elegido <= 0 ? puestos.length - 1 : elegido - 1), 'flecha');
const botonesP = [boton(filaP, 'Todos', () => elegir(-1))];
puestos.forEach((P, i) => botonesP.push(boton(filaP, NOMBRES[P.id], () => elegir(i))));
boton(filaP, '›', () => elegir(elegido >= puestos.length - 1 ? 0 : elegido + 1), 'flecha');
const botonesA = {};
Object.entries(ANIMACIONES).forEach(([k, v]) => botonesA[k] = boton(filaA, v, () => ponerAnim(k)));
filaA.appendChild(Object.assign(document.createElement('span'), { className: 'sep' }));
boton(filaA, '✦ Invocar', () => empezarInvocacion(), 'invocar');

function elegir(i) {
  elegido = i;
  botonesP.forEach((b, k) => b.classList.toggle('activo', k === i + 1));
  puestos.forEach((P, k) => P.g.visible = i < 0 || k === i); // de cerca, solo el elegido
  botonesP[i + 1].scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
  if (i < 0) { destino = { pos: new THREE.Vector3(0, 2, 0), dist: distGeneral() }; titulo.firstChild.textContent = 'Todos'; }
  else {
    const P = puestos[i];
    destino = { pos: new THREE.Vector3(P.g.position.x, 2.6, P.g.position.z + 1.0), dist: vertical() ? 30 : 18 };
    titulo.firstChild.textContent = NOMBRES[P.id];
  }
  marcarAnim();
}
function seleccionados() { return elegido < 0 ? puestos : [puestos[elegido]]; }
function ponerAnim(k) { const t = reloj.getElapsedTime(); seleccionados().forEach(P => { P.anim = k; P.t0 = t; }); marcarAnim(); }
function marcarAnim() { const a = seleccionados()[0].anim; const igual = seleccionados().every(P => P.anim === a); Object.entries(botonesA).forEach(([k, b]) => b.classList.toggle('activo', igual && k === a)); }

const quieto = params.has('quieto');
const reloj = new THREE.Clock();
let dtCam = 0.016, tPrev = 0;
function bucle() {
  const real = reloj.getElapsedTime(); dtCam = Math.min(0.1, real - tPrev); tPrev = real;
  const T = quieto ? 0.6 : real;
  puestos.forEach(P => animar(P, quieto ? 0.6 : T - P.t0, T));
  moverFlotantes(quieto ? 1.3 : real);
  if (INV.activo) pasoInvocacion(dtCam);
  moverParticulas(dtCam);
  colocarCamara();
  renderer.render(escena, camara);
  requestAnimationFrame(bucle);
}
camara.aspect = innerWidth / innerHeight; camara.updateProjectionMatrix();
const inicial = orden.indexOf(params.get('ver'));
if (params.get('anim')) puestos.forEach(P => P.anim = params.get('anim'));
elegir(inicial);
if (params.has('invocar')) setTimeout(empezarInvocacion, 300);
if (inicial >= 0 || params.has('dist')) { if (destino) { objetivo.copy(destino.pos); if (!params.has('dist')) dist = destino.dist; destino = null; } }
bucle();
window.listo = true;
</script>
</body>
