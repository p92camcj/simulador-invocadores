<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invocadores · figuras de bloques (boceto)</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1b2a; overflow: hidden; font-family: system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; }
  #titulo { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; color: #fff;
    font-weight: 700; font-size: 20px; text-shadow: 0 2px 6px #000a; pointer-events: none; }
  #titulo small { display: block; font-weight: 400; font-size: 12px; opacity: .75; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 0 max(10px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, #14121fe6 30%); display: flex; flex-direction: column; gap: 8px; }
  .fila { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px; scrollbar-width: none; align-items: center; }
  .fila::-webkit-scrollbar { display: none; }
  .fila button { flex: none; border: 2px solid #ffffff30; background: #2c2842; color: #f3eefe; border-radius: 999px;
    padding: 9px 15px; font-size: 15px; font-family: inherit; cursor: pointer; }
  .fila button.activo { background: #f2c230; color: #2a1d05; border-color: #f2c230; font-weight: 700; }
  .fila button.flecha { width: 44px; padding: 9px 0; font-size: 18px; }
  .fila button.invocar { background: #7a1022; border-color: #e8284a; }
  .fila[hidden] { display: none; }
  .fila button.criatura { background: #2a1830; }
  .fila .sep { flex: none; width: 1px; height: 26px; background: #ffffff30; }
</style>
</head>
<body>
<div id="titulo">Todos<small>Desliza para girar · pellizca para acercar · toca un personaje para verlo solo</small></div>
<div id="panel">
  <div class="fila" id="filaPersonajes"></div>
  <div class="fila" id="filaInvocaciones" hidden></div>
  <div class="fila" id="filaAnimaciones"></div>
</div>
<script type="module">
import * as THREE from '../vendor/three/three.module.min.js';

// ---------- escena ----------
const params = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const escena = new THREE.Scene();
escena.background = new THREE.Color('#2a2640');
escena.fog = new THREE.Fog('#2a2640', 110, 200);
const camara = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 400);

escena.add(new THREE.HemisphereLight('#fff6e8', '#5a4f7a', 1.1));
const sol = new THREE.DirectionalLight('#fff3dc', 2.2);
sol.position.set(6, 14, 10);
sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, far: 150 });
sol.position.set(10, 30, 20);
escena.add(sol);
const relleno = new THREE.DirectionalLight('#9fb6ff', 0.6);
relleno.position.set(-8, 5, -6);
escena.add(relleno);

// plástico brillante
const plastico = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.32, metalness: 0, ...extra });
const brillo = (color, intensidad = 1.6) => new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: intensidad, roughness: 0.2, transparent: true, opacity: 0.85 });

function sombra(m) { m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return m; }
// Une las piezas fijas de un grupo en una malla por material (muchas menos llamadas de dibujo en móvil).
// Deja aparte lo transparente, lo multimaterial y lo que flota o se anima.
function firma(m) { return [m.color?.getHexString(), m.emissive?.getHexString(), m.emissiveIntensity, m.metalness, m.roughness, m.map?.uuid, m.side].join('|'); }
function fundir(g) {
  g.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(g.matrixWorld).invert(), lotes = new Map(), quitar = [];
  g.traverse(o => {
    if (!o.isMesh || o.isInstancedMesh || Array.isArray(o.material) || o.material.transparent) return;
    for (let a = o; a && a !== g; a = a.parent) if (a.userData.flota || a.userData.noFundir) return;
    const k = firma(o.material); if (!lotes.has(k)) lotes.set(k, { mat: o.material, piezas: [] });
    lotes.get(k).piezas.push({ geo: o.geometry, m: new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld) }); quitar.push(o);
  });
  quitar.forEach(o => o.parent.remove(o));
  for (const { mat, piezas } of lotes.values()) {
    const pos = [], nor = [], uv = [];
    for (const { geo, m } of piezas) {
      const gg = (geo.index ? geo.toNonIndexed() : geo.clone()).applyMatrix4(m);
      pos.push(...gg.attributes.position.array); nor.push(...gg.attributes.normal.array);
      if (gg.attributes.uv) uv.push(...gg.attributes.uv.array); else uv.push(...new Array(gg.attributes.position.count * 2).fill(0));
    }
    const bg = new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); bg.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); bg.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    const mm = new THREE.Mesh(bg, mat); mm.castShadow = mm.receiveShadow = true; g.add(mm);
  }
  return g;
}

// ---------- placa base con tetones ----------
// Tetones HEXAGONALES (no redondos): estilo propio, inspirado en los juguetes de bloques sin copiarlos.
const TETON = new THREE.CylinderGeometry(0.25, 0.25, 0.17, 6);
// Orbes y llamas que levitan: cada uno con su propio ritmo (arriba/abajo, izquierda/derecha).
const FLOTANTES = [];
let semillaFlot = 1;
function flotar(obj, amp = 0.12) {
  const r = () => (semillaFlot = (semillaFlot * 16807) % 2147483647) / 2147483647;
  obj.userData.flota = { base: obj.position.clone(), amp, fx: 0.7 + r() * 0.9, fy: 0.9 + r() * 1.1, fz: 0.6 + r() * 0.8, px: r() * 6.28, py: r() * 6.28, pz: r() * 6.28 };
  FLOTANTES.push(obj);
  return obj;
}
function moverFlotantes(T) {
  for (const o of FLOTANTES) {
    const u = o.userData.flota;
    o.position.set(u.base.x + Math.sin(T * u.fx + u.px) * u.amp, u.base.y + Math.sin(T * u.fy + u.py) * u.amp * 1.3, u.base.z + Math.sin(T * u.fz + u.pz) * u.amp * 0.6);
  }
}
function placa(ancho, fondo, color, paso = 0.8) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(ancho * paso, 0.32, fondo * paso), plastico(color));
  base.position.y = -0.16;
  g.add(base);
  const mt = plastico(color);
  const tetones = new THREE.InstancedMesh(TETON, mt, ancho * fondo);
  let i = 0; const m = new THREE.Matrix4();
  for (let x = 0; x < ancho; x++) for (let z = 0; z < fondo; z++) {
    m.makeTranslation((x - (ancho - 1) / 2) * paso, 0.085, (z - (fondo - 1) / 2) * paso);
    tetones.setMatrixAt(i++, m);
  }
  g.add(tetones);
  return sombra(g);
}
const suelo = placa(52, 50, '#4f8a4b');
suelo.position.y = -0.02;
escena.add(suelo);

// Portal de bloques: la misma construcción que el Portal del Escenario (tarima escalonada con
// disco rúnico, escalinata delantera, piedras bajas con ojos rúnicos, dos pilares altos con arco,
// dos pilares bajos, resplandor del umbral), montada con ladrillos y tetones hexagonales.
const ALTO = 0.96; // altura de la tarima: tres capas de ladrillo
const PIEDRA = '#a9a4b8', PIEDRA_OSC = '#827d94', PIEDRA_CLARA = '#c4bfd2';
function discoRunico(color) {
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  x.translate(256, 256); x.strokeStyle = '#fff'; x.fillStyle = '#fff'; x.lineCap = 'round';
  x.lineWidth = 10; x.beginPath(); x.arc(0, 0, 236, 0, Math.PI * 2); x.stroke();
  x.lineWidth = 5; x.beginPath(); x.arc(0, 0, 200, 0, Math.PI * 2); x.stroke();
  x.beginPath(); x.arc(0, 0, 70, 0, Math.PI * 2); x.stroke();
  x.lineWidth = 6; x.beginPath();
  for (let k = 0; k <= 5; k++) { const a = -Math.PI / 2 + k * Math.PI * 4 / 5; const px = Math.cos(a) * 196, py = Math.sin(a) * 196; k ? x.lineTo(px, py) : x.moveTo(px, py); }
  x.stroke();
  for (let k = 0; k < 12; k++) { // runas cuadradas entre los dos círculos
    const a = k / 12 * Math.PI * 2; x.save(); x.rotate(a); x.translate(0, -218);
    x.lineWidth = 4; x.strokeRect(-9, -9, 18, 18); if (k % 3 === 0) x.fillRect(-4, -4, 8, 8); x.restore();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.MeshBasicMaterial({ map: t, color, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
}
function ladrillo(ancho, alto, fondo, color, tetones = true) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(ancho, alto, fondo), plastico(color)); g.add(b);
  if (tetones) {
    const nx = Math.max(1, Math.round(ancho / 0.8)), nz = Math.max(1, Math.round(fondo / 0.8));
    for (let a = 0; a < nx; a++) for (let c = 0; c < nz; c++) {
      const t = new THREE.Mesh(TETON, plastico(color)); t.position.set((a - (nx - 1) / 2) * 0.8 * Math.min(1, ancho / (nx * 0.8)), alto / 2 + 0.085, (c - (nz - 1) / 2) * 0.8 * Math.min(1, fondo / (nz * 0.8))); g.add(t);
    }
  }
  return g;
}
function portal(color = '#7b5fd0', variante = 0) {
  const g = new THREE.Group();
  const runas = [];
  // tarima: tres capas de 12 lados, cada una algo más estrecha, con tetones en el borde
  [[2.55, PIEDRA, 18], [2.3, PIEDRA_OSC, 16], [2.05, '#5d5870', 0]].forEach(([rad, col, n], k) => {
    const capa = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, 0.32, 12), plastico(col));
    capa.position.y = 0.16 + k * 0.32; g.add(capa);
    for (let q = 0; q < n; q++) {
      const a = (q + 0.5) / n * Math.PI * 2; if (Math.abs(Math.atan2(Math.sin(a - Math.PI / 2), Math.cos(a - Math.PI / 2))) < 0.42) continue; // hueco de la escalinata
      const t = new THREE.Mesh(TETON, plastico(col)); t.position.set(Math.cos(a) * (rad - 0.18), 0.32 * (k + 1) + 0.085, Math.sin(a) * (rad - 0.18)); g.add(t);
    }
  });
  // disco rúnico encendido sobre la tarima
  const disco = new THREE.Mesh(new THREE.PlaneGeometry(3.9, 3.9), discoRunico(color));
  disco.rotation.x = -Math.PI / 2; disco.position.y = ALTO + 0.01; g.add(disco); runas.push(disco);
  // escalinata delantera
  [[0.32, 3.0], [0.64, 2.6]].forEach(([h, z]) => { const e = ladrillo(1.6, h, 0.42, PIEDRA, true); e.position.set(0, h / 2, z); g.add(e); });
  // piedras bajas con ojo rúnico alrededor
  for (let q = 0; q < 9; q++) {
    const a = q / 9 * Math.PI * 2 + 0.35; if (Math.abs(Math.atan2(Math.sin(a - Math.PI / 2), Math.cos(a - Math.PI / 2))) < 0.45) continue;
    const pz = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.38, 0.36, 6), plastico(PIEDRA_OSC)); pz.position.set(Math.cos(a) * 3.15, 0.18, Math.sin(a) * 3.15); g.add(pz);
    const ojo = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.05, 6), brillo(color, 1.6)); ojo.position.set(pz.position.x, 0.38, pz.position.z); g.add(ojo); runas.push(ojo);
  }
  // pilares de ladrillos 1x1 con tira de runas
  const pilar = (x, z, n, roto) => {
    const pg = new THREE.Group(); pg.position.set(x, 0, z); g.add(pg);
    const basa = ladrillo(1.0, 0.32, 1.0, PIEDRA_OSC, false); basa.position.y = 0.16; pg.add(basa);
    for (let k = 0; k < n; k++) {
      const b = ladrillo(0.78, 0.62, 0.78, k % 2 ? PIEDRA : PIEDRA_CLARA, k === n - 1);
      b.position.y = 0.32 + 0.31 + k * 0.64;
      if (roto && k === n - 1) { b.rotation.set(0.15, 0.4, 0.35); b.position.x += 0.12; }
      pg.add(b);
      if (!(roto && k === n - 1)) { const tira = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.36, 0.02), brillo(color, 1.4)); tira.position.set(0, b.position.y, 0.4); pg.add(tira); runas.push(tira); }
    }
    return 0.32 + n * 0.64;
  };
  const altoP = pilar(-1.45, -1.6, 7, false); pilar(1.45, -1.6, 7, variante === 2);
  pilar(-2.35, -0.35, 3, variante === 1); pilar(2.35, -0.35, 3, false);
  // arco de ladrillos entre los pilares altos (entero, o roto según la variante)
  const piezas = 9;
  for (let k = 0; k < piezas; k++) {
    if (variante === 2 && k > 5) continue;
    if (variante === 1 && k === 4) continue;
    const a = Math.PI * (k + 0.5) / piezas;
    const b = ladrillo(0.55, 0.42, 0.78, k % 2 ? PIEDRA : PIEDRA_CLARA, false);
    b.position.set(-Math.cos(a) * 1.45, altoP + Math.sin(a) * 1.1, -1.6); b.rotation.z = a - Math.PI / 2; g.add(b);
  }
  const clave = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.1, 6), brillo(color, 1.8)); clave.rotation.x = Math.PI / 2; clave.position.set(0, altoP + 1.1, -1.18);
  if (variante !== 2) { g.add(clave); runas.push(clave); }
  // resplandor del umbral
  const umbral = new THREE.Mesh(new THREE.PlaneGeometry(2.3, altoP - ALTO + 0.6), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  umbral.position.set(0, ALTO + (altoP - ALTO + 0.6) / 2, -1.62); g.add(umbral);
  // chispas flotantes del Portal
  for (let k = 0; k < 4; k++) {
    const ch = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), brillo(color, 2));
    ch.position.set((k - 1.5) * 0.9, 2.2 + (k % 2) * 1.3, -1.0 + (k % 3) * 0.5); g.add(flotar(ch, 0.35));
  }
  g.userData.runas = runas;
  return sombra(g);
}

// ---------- texturas impresas (cara y torso) ----------
function lienzo(w, h, pinta) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); pinta(x, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const NEGRO = '#1a1418';

// la cara se dibuja centrada en u = 0.5 (la cabeza gira 180° para que el centro mire al frente)
function cara(piel, opciones = {}) {
  const { ojos = 'abiertos', boca = 'sonrisa', barba = null, cejas = NEGRO, gafas = false, sombraTotal = false, mejillas = false, ojosBrillo = null } = opciones;
  return lienzo(512, 256, (x, w, h) => {
    x.fillStyle = sombraTotal ? '#0b0d1a' : piel; x.fillRect(0, 0, w, h);
    const cx = w / 2, oy = 108, sep = 34;
    x.lineCap = 'round';
    if (sombraTotal) {
      if (ojosBrillo) {
        x.shadowColor = ojosBrillo; x.shadowBlur = 18; x.fillStyle = ojosBrillo;
        for (const s of [-1, 1]) { x.beginPath(); x.ellipse(cx + s * sep, oy + 8, 9, 5, 0, 0, Math.PI * 2); x.fill(); }
        x.shadowBlur = 0;
      }
      return;
    }
    if (barba) {
      x.fillStyle = barba;
      x.beginPath(); x.moveTo(cx - 84, 70); x.lineTo(cx - 70, 70); x.quadraticCurveTo(cx - 66, 150, cx, 158); x.quadraticCurveTo(cx + 66, 150, cx + 70, 70); x.lineTo(cx + 84, 70);
      x.quadraticCurveTo(cx + 86, 226, cx, 240); x.quadraticCurveTo(cx - 86, 226, cx - 84, 70); x.fill();
      x.beginPath(); x.moveTo(cx - 44, 150); x.quadraticCurveTo(cx, 128, cx + 44, 150); x.quadraticCurveTo(cx, 146, cx - 44, 150); x.fill(); // bigote
      x.fillStyle = piel; x.beginPath(); x.ellipse(cx, 172, 20, 8, 0, 0, Math.PI * 2); x.fill();
      x.strokeStyle = NEGRO; x.lineWidth = 4; x.beginPath(); x.moveTo(cx - 12, 172); x.lineTo(cx + 12, 172); x.stroke();
    }
    x.strokeStyle = cejas; x.lineWidth = 7;
    for (const s of [-1, 1]) { x.beginPath(); x.moveTo(cx + s * (sep - 16), oy - 26); x.quadraticCurveTo(cx + s * sep, oy - 34, cx + s * (sep + 16), oy - 26); x.stroke(); }
    x.fillStyle = NEGRO; x.strokeStyle = NEGRO; x.lineWidth = 6;
    for (const s of [-1, 1]) {
      if (ojos === 'cerrados') { x.beginPath(); x.arc(cx + s * sep, oy - 2, 12, 0.15 * Math.PI, 0.85 * Math.PI); x.stroke(); }
      else {
        x.beginPath(); x.ellipse(cx + s * sep, oy, 8.5, 11, 0, 0, Math.PI * 2); x.fill();
        x.fillStyle = '#fff'; x.beginPath(); x.arc(cx + s * sep + 3, oy - 4, 3, 0, Math.PI * 2); x.fill(); x.fillStyle = NEGRO;
      }
    }
    if (gafas) {
      x.strokeStyle = '#3a2a22'; x.lineWidth = 5;
      for (const s of [-1, 1]) { x.beginPath(); x.arc(cx + s * sep, oy, 21, 0, Math.PI * 2); x.stroke(); }
      x.beginPath(); x.moveTo(cx - 13, oy - 2); x.lineTo(cx + 13, oy - 2); x.stroke();
    }
    if (mejillas) { x.fillStyle = 'rgba(235,110,110,.45)'; for (const s of [-1, 1]) { x.beginPath(); x.arc(cx + s * 62, oy + 30, 13, 0, Math.PI * 2); x.fill(); } }
    x.strokeStyle = NEGRO; x.lineWidth = 6;
    if (boca === 'sonrisa') { x.beginPath(); x.arc(cx, 132, 26, 0.2 * Math.PI, 0.8 * Math.PI); x.stroke(); }
    else if (boca === 'serena') { x.beginPath(); x.arc(cx, 128, 16, 0.25 * Math.PI, 0.75 * Math.PI); x.stroke(); }
    else if (boca === 'carcajada') {
      x.fillStyle = '#5a1a22'; x.beginPath(); x.moveTo(cx - 34, 130); x.quadraticCurveTo(cx, 186, cx + 34, 130); x.closePath(); x.fill();
      x.fillStyle = '#fff'; x.fillRect(cx - 26, 130, 52, 9);
    } else if (boca === 'firme' && !barba) { x.beginPath(); x.moveTo(cx - 16, 140); x.lineTo(cx + 16, 138); x.stroke(); }
  });
}

// torso: lienzo frontal; pinta(x, w, h) dibuja los detalles impresos
function torsoTex(color, pinta) {
  return lienzo(256, 256, (x, w, h) => { x.fillStyle = color; x.fillRect(0, 0, w, h); pinta && pinta(x, w, h); });
}
function gema(x, cx, cy, r, color) {
  x.fillStyle = '#e7c35a'; x.beginPath(); x.moveTo(cx, cy - r - 5); x.lineTo(cx + r + 5, cy); x.lineTo(cx, cy + r + 5); x.lineTo(cx - r - 5, cy); x.fill();
  x.fillStyle = color; x.beginPath(); x.moveTo(cx, cy - r); x.lineTo(cx + r, cy); x.lineTo(cx, cy + r); x.lineTo(cx - r, cy); x.fill();
  x.fillStyle = 'rgba(255,255,255,.7)'; x.beginPath(); x.arc(cx - r / 3, cy - r / 3, r / 4, 0, Math.PI * 2); x.fill();
}

// ---------- la figurita ----------
// Medidas aproximadas de un muñequito de bloques (unidades: 1 ≈ 1 cm de juguete ×2.5)
function trapecio(anchoArriba, anchoAbajo, alto, fondo) {
  const g = new THREE.BoxGeometry(anchoAbajo, alto, fondo);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) if (p.getY(i) > 0) p.setX(i, p.getX(i) * anchoArriba / anchoAbajo);
  g.computeVertexNormals();
  return g;
}

function figura(d) {
  const f = new THREE.Group();
  const piel = d.piel || '#f2c9a0';
  f.userData.piernas = []; f.userData.falda = !!d.falda;

  // piernas o falda
  if (d.falda) {
    const falda = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.95, 1.55, 4, 1), plastico(d.falda));
    falda.rotation.y = Math.PI / 4; falda.scale.z = 0.62; falda.position.y = 0.78;
    f.add(falda);
    if (d.faldaRibete) {
      const rib = new THREE.Mesh(new THREE.CylinderGeometry(0.97, 0.97, 0.12, 4, 1), plastico(d.faldaRibete));
      rib.rotation.y = Math.PI / 4; rib.scale.z = 0.62; rib.position.y = 0.06; f.add(rib);
    }
  } else {
    const cadera = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.28, 0.62), plastico(d.cadera || d.piernas[0]));
    cadera.position.y = 1.45; f.add(cadera);
    d.piernas.forEach((c, i) => {
      const s = i === 0 ? -1 : 1;
      const pierna = new THREE.Group();
      const muslo = new THREE.Mesh(new THREE.BoxGeometry(0.58, 1.05, 0.62), plastico(c));
      muslo.position.y = -0.55; pierna.add(muslo);
      const pie = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.32, 0.78), plastico(d.botas || c));
      pie.position.set(0, -1.15, 0.08); pierna.add(pie);
      if (d.botas) { const caña = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.45, 0.64), plastico(d.botas)); caña.position.y = -0.85; pierna.add(caña); }
      pierna.position.set(s * 0.31, 1.32, 0);
      pierna.rotation.x = (d.paso || 0) * s;
      f.add(pierna); f.userData.piernas.push(pierna); pierna.userData.base = pierna.rotation.x;
    });
  }

  // torso con estampado
  const tt = torsoTex(d.torso, d.estampado);
  const matTorso = [plastico(d.torso), plastico(d.torso), plastico(d.torso), plastico(d.torso), plastico('#ffffff', { map: tt }), plastico(d.torso)];
  const torso = new THREE.Mesh(trapecio(0.95, 1.3, 1.3, 0.62), matTorso);
  torso.position.y = 2.25; f.add(torso);

  // brazos y manos en C
  const hombroY = 2.72;
  [-1, 1].forEach(s => {
    const brazo = new THREE.Group();
    const color = (s < 0 ? d.brazoIzq : d.brazoDer) || d.brazos || d.torso;
    const sup = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.23, 0.95, 16), plastico(color, color === '#9aa3ad' ? { metalness: 0.7, roughness: 0.25 } : {}));
    sup.position.y = -0.45; brazo.add(sup);
    const hombro = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12), plastico(color)); brazo.add(hombro);
    const puno = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.14, 16), plastico(d.puños || color)); puno.position.y = -0.95; brazo.add(puno);
    const mano = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.08, 10, 18, Math.PI * 1.45), plastico(d.manos || piel));
    mano.rotation.set(0, Math.PI / 2, Math.PI * 0.77); mano.position.y = -1.13; brazo.add(mano);
    brazo.position.set(s * 0.6, hombroY, 0);
    const pose = (s < 0 ? d.poseIzq : d.poseDer) || [0.25, 0.12];
    brazo.rotation.x = -pose[0];
    brazo.rotation.z = s * pose[1];
    brazo.userData.mano = mano; brazo.userData.base = [brazo.rotation.x, brazo.rotation.z];
    f.add(brazo);
    f.userData[s < 0 ? 'brazoIzq' : 'brazoDer'] = brazo;
  });

  // cuello y cabeza
  const cuello = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.12, 16), plastico(piel)); cuello.position.y = 2.96; f.add(cuello);
  const cabeza = new THREE.Group(); cabeza.position.y = 3.45; f.add(cabeza);
  const caraMat = plastico('#ffffff', { map: cara(piel, d.cara) });
  const craneo = new THREE.Mesh(new THREE.CylinderGeometry(0.43, 0.43, 0.82, 40, 1), [caraMat, plastico(d.cara?.sombraTotal ? '#0b0d1a' : piel), plastico(piel)]);
  craneo.rotation.y = Math.PI; cabeza.add(craneo);
  for (const y of [0.41, -0.41]) { const bisel = new THREE.Mesh(new THREE.TorusGeometry(0.39, 0.05, 8, 40), plastico(piel)); bisel.rotation.x = Math.PI / 2; bisel.position.y = y; cabeza.add(bisel); }
  const tet = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.16, 6), plastico(piel)); tet.position.y = 0.5; cabeza.add(tet);

  if (d.pelo) cabeza.add(d.pelo());
  if (d.capa) f.add(capa(d.capa, d.capaLarga));
  if (d.extra) d.extra(f, cabeza);
  f.userData.cabeza = cabeza;
  return sombra(f);
}

// capa: lámina doblada a la espalda
function capa(color, larga = 2.3) {
  const g = new THREE.Group();
  const forma = new THREE.Shape();
  forma.moveTo(-0.5, 0); forma.lineTo(0.5, 0); forma.lineTo(0.85, -larga); forma.lineTo(-0.85, -larga); forma.closePath();
  const geo = new THREE.ExtrudeGeometry(forma, { depth: 0.06, bevelEnabled: false });
  const m = new THREE.Mesh(geo, plastico(color, { side: THREE.DoubleSide }));
  m.position.set(0, 2.9, -0.37); m.rotation.x = 0.1;
  g.add(m);
  return g;
}

function peloMelena(color, largo = 1.0, flequillo = true) {

    const trasera = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.62, largo, 32, 1, true, Math.PI * 0.3, Math.PI * 1.4), plastico(color, { side: THREE.DoubleSide }));
    trasera.position.y = 0.26 - largo / 2; g.add(trasera);
    for (const s of [-1, 1]) { const mech = new THREE.Mesh(new THREE.BoxGeometry(0.16, largo * 0.85, 0.3), mt); mech.position.set(s * 0.47, 0.26 - largo * 0.45, 0.22); mech.rotation.z = s * -0.08; g.add(mech); }
    if (flequillo) { const f = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.16, 0.2), mt); f.position.set(0, 0.36, 0.38); f.rotation.x = -0.35; g.add(f); }

function peloCorto(color, despeinado = true) {
  return () => {

    if (despeinado) for (let k = 0; k < 5; k++) {

      const a = -0.9 + k * 0.45; m.position.set(Math.sin(a) * 0.3, 0.62 - Math.abs(a) * 0.05, Math.cos(a) * 0.2 + 0.08); m.scale.set(1.2, 0.6, 1); m.rotation.z = -a * 0.5; g.add(m);

function capucha(color, forro = '#0b0d1a', pico = true) {
  return () => {
    const g = new THREE.Group();
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.64, 32, 20, Math.PI * 0.78, Math.PI * 1.44, 0, Math.PI * 0.78), plastico(color, { side: THREE.DoubleSide }));
    c.position.y = 0.05;
    const frente = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 20, 0, Math.PI * 2, 0, Math.PI * 0.2), plastico(color)); frente.position.y = 0.05; frente.scale.set(1, 1.15, 1); g.add(frente); c.scale.set(1, 1.15, 1); g.add(c);
        if (pico) { const p = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.45, 16), plastico(color)); p.position.set(0, 0.62, -0.12); p.rotation.x = -0.5; g.add(p); }
    const cuelloC = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.72, 0.28, 32), plastico(color)); cuelloC.position.y = -0.58; g.add(cuelloC);

// ---------- animales de bloques ----------
function animal(tipo) {
  const f = new THREE.Group(), U = f.userData;
  U.animal = true; U.piernas = []; U.falda = false;
  const add = (geo, mat, x, y, z, padre = f) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); padre.add(m); return m; };
  const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const cabeza = new THREE.Group(); f.add(cabeza); U.cabeza = cabeza;
  const ojo = (padre, x, y, z, iris = '#3aa65a', r = 0.12) => { add(new THREE.CylinderGeometry(r, r, 0.06, 6), plastico(iris), x, y, z, padre).rotation.x = Math.PI / 2; add(new THREE.CylinderGeometry(r * 0.5, r * 0.5, 0.08, 6), plastico('#111'), x, y, z + 0.02, padre).rotation.x = Math.PI / 2; add(new THREE.SphereGeometry(r * 0.25, 6, 4), plastico('#fff'), x + r * 0.3, y + r * 0.3, z + 0.05, padre); };
  const pata = (x, z, alto, color, pezuna) => { const g = new THREE.Group(); g.position.set(x, alto, z); f.add(g); add(B(0.32, alto, 0.34), plastico(color), 0, -alto / 2, 0, g); if (pezuna) add(B(0.34, 0.16, 0.38), plastico(pezuna), 0, -alto + 0.08, 0.02, g); g.userData.base = 0; U.piernas.push(g); return g; };
  if (tipo === 'perro') { // Reena: perrita blanca y negra con capa azul
    const blanco = '#f4f1ea', negro = '#1d1b20';
    add(B(1.0, 0.9, 1.9), plastico(blanco), 0, 1.45, 0); add(B(1.02, 0.4, 0.9), plastico(negro), 0, 1.75, -0.4);
    [[-0.32, 0.65], [0.32, 0.65], [-0.32, -0.65], [0.32, -0.65]].forEach(([x, z]) => pata(x, z, 1.0, blanco));
    // capa azul con correa morada y gema
    add(B(1.25, 0.12, 1.7), plastico('#1f4fb0'), 0, 1.96, -0.05); for (const s of [-1, 1]) add(B(0.1, 0.9, 1.7), plastico('#1f4fb0'), s * 0.62, 1.55, -0.05);
    add(B(1.1, 0.22, 0.2), plastico('#6a3aa0'), 0, 1.65, 0.9); add(new THREE.CylinderGeometry(0.18, 0.18, 0.1, 6), brillo('#4ab0ff', 1.2), 0, 1.65, 1.02).rotation.x = Math.PI / 2;
    cabeza.position.set(0, 2.35, 1.0);
    add(B(0.85, 0.75, 0.75), plastico(blanco), 0, 0, 0, cabeza); add(B(0.87, 0.35, 0.77), plastico(negro), 0, 0.22, 0, cabeza);
    add(B(0.45, 0.35, 0.5), plastico(blanco), 0, -0.18, 0.55, cabeza); add(B(0.2, 0.14, 0.12), plastico(negro), 0, -0.06, 0.82, cabeza);
    for (const s of [-1, 1]) { const o = add(B(0.12, 0.5, 0.35), plastico(negro), s * 0.48, 0.35, -0.05, cabeza); o.rotation.z = s * 0.5; ojo(cabeza, s * 0.2, 0.05, 0.38, '#5a3a22', 0.1); }
    const cola = new THREE.Group(); cola.position.set(0, 1.85, -0.95); f.add(cola); const tubo = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0.5, -0.3), new THREE.Vector3(0, 0.9, -0.1), new THREE.Vector3(0, 0.8, 0.2)]);
    add(new THREE.TubeGeometry(tubo, 12, 0.11, 6), plastico(blanco), 0, 0, 0, cola); U.cola = cola;
  } else if (tipo === 'buho') { // Sora: búho naranja de ojos verdes, alas abiertas
    const nar = '#e8843a', claro = '#f6c08a', osc = '#b8551e';
    const cuerpo = add(new THREE.CylinderGeometry(0.7, 0.85, 1.6, 6), plastico(nar), 0, 1.8, 0);
    add(new THREE.CylinderGeometry(0.5, 0.62, 1.2, 6, 1, false, -0.8, 1.6), plastico(claro), 0, 1.7, 0.12);
    for (let k = 0; k < 4; k++) add(new THREE.OctahedronGeometry(0.1), brillo('#ffd86a', 1), (k % 2 ? 0.18 : -0.18), 1.4 + k * 0.22, 0.75);
    cabeza.position.set(0, 3.0, 0);
    add(new THREE.CylinderGeometry(0.75, 0.72, 0.85, 6), plastico(nar), 0, 0, 0, cabeza);
    add(new THREE.CylinderGeometry(0.62, 0.62, 0.08, 6), plastico(claro), 0, 0, 0.62, cabeza).rotation.x = Math.PI / 2;
    for (const s of [-1, 1]) { ojo(cabeza, s * 0.27, 0.05, 0.68, '#3fbf6b', 0.2); const t = add(new THREE.ConeGeometry(0.16, 0.5, 4), plastico(osc), s * 0.48, 0.55, 0, cabeza); t.rotation.z = -s * 0.35; }
    add(new THREE.ConeGeometry(0.1, 0.3, 4), plastico('#f2c230'), 0, -0.15, 0.72, cabeza).rotation.x = Math.PI / 2 + 0.4;
    U.alas = [-1, 1].map(s => { const ala = new THREE.Group(); ala.position.set(s * 0.7, 2.4, -0.1); f.add(ala);
      for (let k = 0; k < 4; k++) { const pl = add(B(0.5, 0.12, 1.6 - k * 0.25), plastico(k % 2 ? osc : nar), s * (0.35 + k * 0.42), 0.2 + k * 0.28, -0.1, ala); pl.rotation.z = s * 0.15; }
      ala.rotation.z = s * 0.5; return ala; });
    for (const s of [-1, 1]) { const g = pata(s * 0.3, 0.1, 0.9, '#f2c230'); }
  } else { // Lumo: cervato dorado con capa verde y gemas
    const piel = '#f2d58a', claro = '#fbe8b8';
    add(B(0.85, 0.8, 1.7), plastico(piel), 0, 1.75, 0);
    [[-0.27, 0.6], [0.27, 0.6], [-0.27, -0.6], [0.27, -0.6]].forEach(([x, z]) => pata(x, z, 1.35, piel, '#3a2a1e'));
    for (let k = 0; k < 4; k++) add(new THREE.OctahedronGeometry(0.11), brillo('#ffb84a', 1), (k % 2 ? 0.44 : -0.44), 1.75, -0.5 + k * 0.33);
    add(B(1.0, 0.12, 1.0), plastico('#3f7a3a'), 0, 2.18, 0.35); for (const s of [-1, 1]) add(B(0.1, 0.5, 0.9), plastico('#3f7a3a'), s * 0.5, 1.95, 0.35);
    add(new THREE.OctahedronGeometry(0.14), brillo('#ffb84a', 1.2), 0, 2.0, 0.92);
    add(B(0.4, 0.9, 0.45), plastico(piel), 0, 2.45, 0.7).rotation.x = 0.35;
    cabeza.position.set(0, 3.0, 0.95);
    add(B(0.65, 0.6, 0.65), plastico(piel), 0, 0, 0, cabeza); add(B(0.4, 0.32, 0.45), plastico(claro), 0, -0.14, 0.42, cabeza); add(B(0.16, 0.12, 0.1), plastico('#2a1d14'), 0, -0.04, 0.66, cabeza);
    for (const s of [-1, 1]) { const o = add(B(0.18, 0.7, 0.35), plastico(piel), s * 0.48, 0.5, -0.05, cabeza); o.rotation.z = s * 0.7; ojo(cabeza, s * 0.18, 0.08, 0.33, '#3fbf6b', 0.12); }
    add(new THREE.OctahedronGeometry(0.1), brillo('#ffb84a', 1.2), 0, 0.3, 0.33, cabeza);
    const cola = new THREE.Group(); cola.position.set(0, 2.05, -0.85); f.add(cola); add(B(0.2, 0.35, 0.18), plastico(claro), 0, 0.1, 0, cola); U.cola = cola;
  }
  // brazos de mentira (las animaciones comunes los ignoran) y «mano» en la cabeza
  for (const k of ['brazoIzq', 'brazoDer']) { const b = new THREE.Group(); b.userData.base = [0, 0]; b.userData.mano = new THREE.Object3D(); cabeza.add(b); b.add(b.userData.mano); b.userData.mano.position.set(0, 0, 0.6); U[k] = b; }
  U.extraAnim = (f, t, modo) => {
    const rapido = modo === 'andar' || modo === 'celebrar' || modo === 'saludar' || modo === 'alzar';
    if (U.cola) U.cola.rotation.z = Math.sin(t * (rapido ? 14 : 5)) * 0.5;
    if (U.alas) U.alas.forEach((a, i) => { a.rotation.z = (i ? 1 : -1) * (0.5 + Math.sin(t * (rapido ? 12 : 3)) * (rapido ? 0.5 : 0.12)); });
    if (U.alas) f.position.y += 0.4 + Math.sin(t * 2) * 0.1; // el búho flota un poco
    if (modo === 'saludar' || modo === 'alzar') { f.position.y += Math.abs(Math.sin(t * 5)) * 0.5; cabeza.rotation.z = Math.sin(t * 6) * 0.2; }
  };
  return sombra(f);
}

  [P.manoVisG, P.manoOcuG].forEach(o => o && P.g.remove(o));
  P.mano = { vis, ocu };
  P.manoVisG = fundir(PERSONAJES[vis]()); P.manoVisG.scale.setScalar(ESCALA_MANO); P.manoVisG.position.copy(SITIO_MANO.vis); P.manoVisG.rotation.y = 0.25;

  f.position.set(0, ALTO, 0); f.rotation.set(0, 0, 0); anillo.visible = false;
  f.userData.piernas.forEach(p => p.rotation.x = p.userData.base);
  brazos(f, (b, rx, rz) => { b.rotation.x = rx; b.rotation.z = rz; });
  cab.rotation.set(0, 0, 0);
  if (P.anim === 'reposo') {
    cab.rotation.y = Math.sin(T * 0.8 + P.g.position.x) * 0.25;
    f.position.y = ALTO + Math.abs(Math.sin(T * 1.6)) * 0.03;
    brazos(f, (b, rx, rz, s) => { b.rotation.x = rx + Math.sin(T * 1.6 + s) * 0.06; });
  } else if (P.anim === 'andar') {
    // baja del Portal, da una vuelta y vuelve a subir
    const R = 3.4, w = 0.7, th = (t * w) % (Math.PI * 2);
    const x = Math.sin(th) * R, z = R - Math.cos(th) * R;
    const dc = Math.hypot(x, z); // sobre la tarima, bajando la escalinata o en el suelo
    f.position.set(x, dc < 2.0 ? ALTO : dc > 3.25 ? 0.02 : ALTO * (3.25 - dc) / 1.25, z);
    f.rotation.y = Math.PI / 2 - th;
    const fase = t * 9;
    f.userData.piernas.forEach((p, i) => p.rotation.x = Math.sin(fase + i * Math.PI) * 0.55);
    brazos(f, (b, rx, rz, s) => { b.rotation.x = rx + Math.sin(fase + (s < 0 ? 0 : Math.PI)) * 0.45; });
    f.position.y += Math.abs(Math.sin(fase)) * 0.12;
    if (f.userData.falda) f.rotation.z = Math.sin(fase) * 0.07;
    cab.rotation.y = Math.sin(fase / 2) * 0.1;
  } else if (P.anim === 'saludar') {
    const b = f.userData.brazoDer;
    b.rotation.x = -2.7; b.rotation.z = 0.35 + Math.sin(t * 9) * 0.35;
    cab.rotation.z = -0.12; cab.rotation.y = Math.sin(t * 2) * 0.15;
    f.position.y = ALTO + Math.abs(Math.sin(t * 4.5)) * 0.08;
  } else if (P.anim === 'alzar') { // invocando: brazos al cielo
    brazos(f, (b, rx, rz, s) => { b.rotation.x = -2.8 + Math.sin(t * 6 + s) * 0.08; b.rotation.z = s * 0.25; });
    cab.rotation.x = -0.25; f.position.y = ALTO + Math.min(1, t) * 0.25 + Math.sin(t * 3) * 0.05;
  } else if (P.anim === 'celebrar') { // recibe su Gema: dos saltitos de alegría
    if (t > 1.3) { P.anim = 'reposo'; return; }
    f.position.y = ALTO + Math.abs(Math.sin(t * Math.PI * 1.55)) * 0.7;
    brazos(f, (b, rx, rz, s) => { b.rotation.x = -2.6; b.rotation.z = s * (0.5 + Math.sin(t * 12) * 0.15); });
  } else if (P.anim === 'habilidad') {
    // la pose la pone la escena de su habilidad (ver HABILIDADES)
  }
  f.userData.extraAnim?.(f, P.anim === 'reposo' ? T : t, P.anim);
}

// Una criatura de bloques: el mismo cuerpo para todas y los adornos de cada una
function criaturaBloques(D) {
  const g = new THREE.Group();
  const em = (c, i) => ({ emissive: c, emissiveIntensity: i });
  const cuerpo = plastico(D.c, em(D.osc, 0.45));
  const claro = plastico(D.c2, em(D.c, 0.55));
  const oscuro = plastico(D.osc, em(D.osc, 0.3));
  const cristal = new THREE.MeshStandardMaterial({ color: D.c2, emissive: D.c, emissiveIntensity: 0.9, transparent: true, opacity: 0.8, roughness: 0.1, flatShading: true });
  const hoja = plastico(VERDE, em('#1a5a20', 0.3));
  const add = (geo, mat, x, y, z, padre = g) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); padre.add(m); return m; };
  const cono = (r, h, mat, x, y, z, rz = 0, rx = 0, padre = g) => { const c = add(new THREE.ConeGeometry(r, h, 4), mat, x, y, z, padre); c.rotation.set(rx, 0, rz); return c; };
  // piernas que acaban en punta (flota), cinturón y torso con cristales
  for (const s of [-1, 1]) add(new THREE.CylinderGeometry(0.45, 0.1, 3.2, 4), cuerpo, s * 0.55, 2.0, 0).rotation.y = Math.PI / 4;
  add(new THREE.BoxGeometry(2.0, 0.5, 1.0), oscuro, 0, 3.7, 0);
  add(trapecio(1.6, 2.8, 2.6, 1.2), cuerpo, 0, 5.2, 0);

  else for (const [x, y] of [[0, 5.4], [-0.55, 5.9], [0.55, 5.9], [0, 4.5]]) add(new THREE.OctahedronGeometry(0.28), cristal, x, y, 0.62).scale.set(1, 1.5, 0.6);
  // hombros
  for (const s of [-1, 1]) {
    if (D.hombros === 'puas') for (let i = 0; i < 3; i++) cono(0.28, 1.3 - i * 0.25, i ? oscuro : cuerpo, s * (1.5 + i * 0.3), 6.6 - i * 0.15, 0, -s * (0.4 + i * 0.4));
    if (D.hombros === 'hojas') for (let i = 0; i < 2; i++) { const h = add(new THREE.BoxGeometry(1.5, 0.12, 0.7), hoja, s * (1.7 + i * 0.4), 6.4 - i * 0.35, 0); h.rotation.z = -s * (0.35 + i * 0.3); }
    if (D.hombros === 'plumas') for (let i = 0; i < 3; i++) { const p = add(new THREE.BoxGeometry(0.35, 1.5 - i * 0.3, 0.12), i % 2 ? claro : cuerpo, s * (1.45 + i * 0.32), 6.5 - i * 0.2, 0); p.rotation.z = -s * (0.6 + i * 0.35); }

    add(new THREE.CylinderGeometry(0.3, 0.24, 2.6, 4), cuerpo, 0, -1.3, 0, b).rotation.y = Math.PI / 4;
    const mano = add(new THREE.TorusGeometry(0.35, 0.16, 8, 12, Math.PI * 1.45), claro, 0, -2.75, 0, b); mano.rotation.set(0, Math.PI / 2, Math.PI * 0.77);

  }
  // cabeza
  add(new THREE.CylinderGeometry(0.3, 0.3, 0.3, 6), oscuro, 0, 6.65, 0);
  const H = D.cabeza;
  if (H === 'capullo') { // Brose: sin cabeza, un capullo de rosa de pétalos enrollados
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; const p = add(new THREE.CylinderGeometry(0.5, 0.25, 1.6, 6, 1, true, 0, Math.PI), i % 2 ? cuerpo : claro, Math.cos(a) * 0.25, 7.5, Math.sin(a) * 0.25); p.rotation.y = -a; p.material = p.material.clone(); p.material.side = THREE.DoubleSide; }

    for (const s of [-1, 1]) { const h = add(new THREE.BoxGeometry(1.0, 0.1, 0.5), hoja, s * 0.6, 6.9, 0); h.rotation.z = s * 0.5; }
  } else if (H === 'girasol') { // Caisis: cara de girasol con pétalos

    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; const p = add(new THREE.BoxGeometry(0.4, 1.0, 0.12), i % 2 ? cuerpo : claro, Math.cos(a) * 1.15, 7.6 + Math.sin(a) * 1.15, 0.05); p.rotation.z = a - Math.PI / 2; }
  } else if (H === 'luz') { // Madain: cabeza de luz blanca con corona de rayos
    const c = add(new THREE.CylinderGeometry(0.75, 0.75, 1.25, 6), brillo('#ffffff', 2.5), 0, 7.45, 0); flotar(c, 0.04);
  } else {
    const cab = add(new THREE.CylinderGeometry(0.7, 0.7, 1.2, 6), H === 'vacio' ? plastico('#1a1040', em('#2a1a80', 0.4)) : claro, 0, 7.4, 0);
    if (H === 'vacio') { const ojo = add(new THREE.OctahedronGeometry(0.3), brillo(D.c2, 2.2), 0, 7.45, 0.68); ojo.scale.set(1.4, 0.7, 0.5); }
    else add(new THREE.OctahedronGeometry(0.22), cristal, 0, 7.55, 0.66);
    if (H === 'puas') { cono(0.22, 2.0, cuerpo, 0, 8.9, 0); for (const s of [-1, 1]) for (let i = 0; i < 3; i++) cono(0.16, 1.4 - i * 0.3, i ? oscuro : cuerpo, s * (0.25 + i * 0.25), 8.4 - i * 0.12, 0, -s * (0.35 + i * 0.35)); }
    if (H === 'llamas') for (let i = 0; i < 7; i++) { const a = (i - 3) * 0.32; cono(0.2, 1.1 + (3 - Math.abs(i - 3)) * 0.35, i % 2 ? claro : cuerpo, Math.sin(a) * 0.7, 8.3 + Math.cos(a) * 0.2, 0, -a); }
    if (H === 'lirio') for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; const p = add(new THREE.BoxGeometry(0.6, 1.9, 0.12), i % 2 ? cuerpo : claro, Math.cos(a) * 0.55, 8.6, Math.sin(a) * 0.55); p.rotation.set(Math.sin(a) * 0.55, -a, -Math.cos(a) * 0.55); }
    if (H === 'orejas') for (const s of [-1, 1]) { cono(0.3, 1.9, cuerpo, s * 0.55, 8.6, 0, -s * 0.35); cono(0.16, 1.2, claro, s * 0.55, 8.4, 0.12, -s * 0.35); }
    if (H === 'astas') for (const s of [-1, 1]) {
      const a = add(new THREE.CylinderGeometry(0.1, 0.13, 1.6, 6), oscuro, s * 0.55, 8.6, 0); a.rotation.z = -s * 0.45;
      for (let i = 0; i < 2; i++) cono(0.14, 0.9, claro, s * (0.95 + i * 0.3), 8.9 + i * 0.45, 0, -s * (0.9 - i * 0.5));

    }
    if (H === 'remolino') { const r = add(new THREE.TorusGeometry(1.05, 0.09, 6, 6), brillo(D.c2, 1.5), 0, 7.4, 0); r.rotation.x = Math.PI / 2.4; g.userData.gira = r; cono(0.3, 1.4, cuerpo, 0, 8.6, 0); }
  }
  // halo de rayos tras la cabeza
  if (D.halo) for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; const r = add(new THREE.BoxGeometry(0.16, 0.9 + (i % 2) * 0.5, 0.08), brillo(D.gema ? '#fff6c8' : D.c, 1.6), Math.cos(a) * 1.6, 7.6 + Math.sin(a) * 1.6, -0.5); r.rotation.z = a - Math.PI / 2; }
  // falda
  if (D.falda) for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2, x = Math.cos(a) * 1.2, z = Math.sin(a) * 0.7;
    if (D.falda === 'llamas') { const c = cono(0.32, 1.6 + (i % 3) * 0.4, i % 2 ? claro : cuerpo, x, 3.0, z, 0, Math.PI); c.rotation.z = -Math.cos(a) * 0.3; c.rotation.x = Math.PI + Math.sin(a) * 0.3; }
    else { const p = add(new THREE.BoxGeometry(0.75, 1.9, 0.14), i % 2 ? claro : cuerpo, x, 2.8, z); p.rotation.set(Math.sin(a) * 0.35, -a + Math.PI / 2, 0); }
  }
  // espada clavada delante
  if (D.espada) {
    const esp = new THREE.Group(); esp.position.set(0, 0, 1.4); g.add(esp);
    add(new THREE.BoxGeometry(0.28, 3.6, 0.1), cristal, 0, 2.2, 0, esp);
    add(new THREE.ConeGeometry(0.2, 0.6, 4), cristal, 0, 0.1, 0, esp).rotation.x = Math.PI;
    add(new THREE.BoxGeometry(1.4, 0.22, 0.3), oscuro, 0, 4.05, 0, esp);
    add(new THREE.BoxGeometry(0.22, 0.9, 0.22), oscuro, 0, 4.6, 0, esp);
    add(new THREE.OctahedronGeometry(0.22), cristal, 0, 5.2, 0, esp);
  }
  // manto de dos paños
  if (D.manto) for (const s of [-1, 1]) {
    const forma = new THREE.Shape(); forma.moveTo(0, 0); forma.lineTo(s * 1.0, 0); forma.lineTo(s * 2.6, -5.2); forma.lineTo(s * 0.2, -5.6); forma.closePath();
    const ala = add(new THREE.ExtrudeGeometry(forma, { depth: 0.08, bevelEnabled: false }), new THREE.MeshStandardMaterial({ color: D.c, emissive: D.osc, emissiveIntensity: 0.5, transparent: true, opacity: 0.85, side: THREE.DoubleSide }), s * 0.3, 6.5, -0.7);
    ala.rotation.x = 0.18;
  }
  // alas: de plumas (Madain, un lado frío y otro cálido) o de aire (Aspir)
  if (D.alas) {
    g.userData.alas = [];
    for (const s of [-1, 1]) {
      const ala = new THREE.Group(); ala.position.set(s * 0.8, 6.3, -0.6); g.add(ala); g.userData.alas.push(ala);
      const cols = D.alas === 'plumas' ? (s < 0 ? ['#bfe6ff', '#8ac8ff', '#e6f6ff'] : ['#ffe2b0', '#ffb8d0', '#fff2dc']) : [D.c, D.c2, D.c];
      for (let i = 0; i < 6; i++) {
        const largo = 3.4 - Math.abs(i - 1.5) * 0.45;
        const p = add(new THREE.BoxGeometry(0.5, largo, 0.1), D.alas === 'aire' ? new THREE.MeshStandardMaterial({ color: cols[i % 3], emissive: D.c, emissiveIntensity: 0.6, transparent: true, opacity: 0.6 }) : plastico(cols[i % 3], em(cols[i % 3], 0.35)), s * (0.6 + i * 0.55), 0.6 + i * 0.15, 0, ala);

      }
    }
  }
  // lo que flota a su alrededor
  const N = D.flotan === 'gemas' ? 7 : 8;
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2; let c;
    const ARCO = ['#e84a4a', '#f2c230', '#3fbf6b', '#3a8fd6', '#9a5ad6', '#ff8f3a', '#5ff2e6'];
    if (D.flotan === 'gemas') { c = add(new THREE.OctahedronGeometry(0.3), plastico(ARCO[i], em(ARCO[i], 0.8)), (i / (N - 1) - 0.5) * 7, 6.5 + Math.sin(i / (N - 1) * Math.PI) * 4, -0.9); c.scale.y = 1.5; }
    else if (D.flotan === 'estrellas') { c = add(new THREE.OctahedronGeometry(0.16), brillo('#ffffff', 2), Math.cos(a) * 2.8, 2.5 + (i % 4) * 1.4, Math.sin(a) * 1.6); }
    else if (D.flotan === 'petalos' || D.flotan === 'plumas') { c = add(new THREE.BoxGeometry(0.35, 0.08, 0.6), i % 2 ? claro : (D.flotan === 'petalos' ? cuerpo : hoja), Math.cos(a) * 2.8, 2.5 + (i % 4) * 1.3, Math.sin(a) * 1.5); c.rotation.set(a, a, 0); if (D.flotan === 'plumas') c.material = claro; }
    else if (D.flotan === 'brasas') { c = add(new THREE.BoxGeometry(0.25, 0.25, 0.25), brillo(i % 2 ? D.c : D.c2, 1.8), Math.cos(a) * 2.6, 2.4 + (i % 4) * 1.4, Math.sin(a) * 1.4); }
    else if (D.flotan === 'anillos') { c = add(new THREE.TorusGeometry(0.3, 0.06, 6, 6), brillo(D.c2, 1.5), Math.cos(a) * 2.7, 2.5 + (i % 4) * 1.3, Math.sin(a) * 1.5); }
    else { c = add(new THREE.OctahedronGeometry(0.2), cristal, Math.cos(a) * 2.6, 2.5 + (i % 4) * 1.3, Math.sin(a) * 1.4); c.scale.y = 1.6; }
    flotar(c, 0.25);
  }
  g.userData.brazos = brazos;
  const mats = []; g.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; o.material.userData.op = o.material.opacity; mats.push(o.material); o.castShadow = true; } });
  g.userData.mats = mats;
  return g;
}
// Un material tornasolado para el corazón de Madain
function arcoiris() {
  const t = lienzo(64, 64, (x) => { const gr = x.createLinearGradient(0, 0, 64, 64); ['#ff6a6a', '#ffd86a', '#6aff9a', '#6ac8ff', '#c86aff'].forEach((col, i) => gr.addColorStop(i / 4, col)); x.fillStyle = gr; x.fillRect(0, 0, 64, 64); });
  return new THREE.MeshStandardMaterial({ map: t, emissive: '#ffffff', emissiveMap: t, emissiveIntensity: 0.9, roughness: 0.1 });
}
let INVOCACION = CRIATURAS.baelorith;
const filasGrid = Math.max(...puestos.map(P => P.g.position.z));
const SITIO = new THREE.Vector3(0, 0, filasGrid + 13);
const CIELO = SITIO.clone().add(new THREE.Vector3(0, 12, 0));
const ALTURA_VUELO = 3.5; // a qué altura levita la criatura

// Partículas: tetones y placas sueltas que vuelan (confeti de bloques)
const PIEZA_CHISPA = new THREE.CylinderGeometry(0.12, 0.12, 0.08, 6);
const particulas = [];
function chispa(pos, color, { vel = new THREE.Vector3(), vida = 1, grav = 0, hacia = null, arco = 0, tam = 1 } = {}) {
  const m = new THREE.Mesh(PIEZA_CHISPA, new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1.2, transparent: true, roughness: 0.3 }));
  m.position.copy(pos); m.scale.setScalar(tam); m.rotation.set(Math.random() * 6, Math.random() * 6, 0);
  escena.add(m); particulas.push({ m, vel, vida, t: 0, grav, desde: pos.clone(), hacia, arco });
}
function moverParticulas(dt) {
  for (let i = particulas.length - 1; i >= 0; i--) {
    const q = particulas[i]; q.t += dt; const k = q.t / q.vida;
    if (k >= 1) { escena.remove(q.m); q.m.material.dispose(); particulas.splice(i, 1); continue; }
    if (q.hacia) { q.m.position.lerpVectors(q.desde, q.hacia, k); q.m.position.y += Math.sin(k * Math.PI) * q.arco; }
    else { q.vel.y -= q.grav * dt; q.m.position.addScaledVector(q.vel, dt); }
    q.m.rotation.x += dt * 4; q.m.rotation.y += dt * 3;
    q.m.material.opacity = Math.min(1, (1 - k) * 2);
  }
}
const azar = (a) => (Math.random() - 0.5) * a;
function estallido(pos, colores, n, fuerza = 4, grav = 6) {
  for (let i = 0; i < n; i++) chispa(pos, colores[i % colores.length], { vel: new THREE.Vector3(azar(2), Math.random(), azar(2)).normalize().multiplyScalar(fuerza * (0.5 + Math.random())), vida: 1 + Math.random(), grav });
}

function opacidadDe(g, k) { for (const m of g.userData.mats) m.opacity = m.userData.op * k; }

function gemaBloque(color, color2) {
  const g = new THREE.Group();
  const mat = (c) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.7, roughness: 0.15, flatShading: true });
  if (color2) { // Gema de Madain: mitad azul, mitad rosa
    for (const [c, sy] of [[color, 1], [color2, -1]]) { const h = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.42, 4), mat(c)); h.position.y = sy * 0.21; if (sy < 0) h.rotation.x = Math.PI; h.scale.set(1.5, 2, 1.5); h.position.y *= 2; g.add(h); }
  } else { const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.42), mat(color)); m.scale.set(1.5, 2, 1.5); g.add(m); }
  const halo = new THREE.PointLight(color, 2, 3); g.add(halo);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.1, 6), plastico('#e2b453')); base.position.y = -0.5; g.add(base);
  return sombra(g);
}

const INV = { activo: false, t: 0 }; window.INV = INV;
let granCirculo = null, criatura = null, gemas = [], nuevoPortal = null, pila = 0;
const narrar = (texto) => { titulo.lastChild.textContent = texto; };
function limpiarInvocacion() {
  [granCirculo, criatura, nuevoPortal, ...gemas].forEach(o => o && escena.remove(o));
  granCirculo = criatura = nuevoPortal = null; gemas = [];
}
const lista = (ids) => ids.map(n => NOMBRES[n]).join(', ').replace(/, ([^,]*)$/, ' y $1');
function empezarInvocacion(clave = 'baelorith') {
  limpiarInvocacion(); elegir(-1);
  INVOCACION = CRIATURAS[clave];
  INV.activo = true; INV.t = 0; INV.hechos = new Set();
  INV.req = puestos.filter(P => INVOCACION.need.includes(P.id));
  titulo.firstChild.textContent = INVOCACION.nombre;
  // encuadra los Portales de los requeridos y el sitio donde aparece la criatura
  const ps = [...INV.req.map(P => P.g.position), SITIO, SITIO, SITIO];
  const c = ps.reduce((a, b) => a.clone().add(b)).multiplyScalar(1 / ps.length);
  const ancho = Math.max(10, ...ps.map(p => Math.hypot(p.x - c.x, (p.z - c.z) * 0.8)));
  destino = { pos: c.setY(6), dist: vertical() ? 30 + ancho * 3.3 : 16 + ancho * 1.6 };
}
const colorGema = () => INVOCACION.gema ? '#3a8fff' : INVOCACION.c;
const una = (clave, fn) => { if (!INV.hechos.has(clave)) { INV.hechos.add(clave); fn(); } };
const suave = (k) => k * k * (3 - 2 * k), limita = (k) => Math.max(0, Math.min(1, k));
function manoDe(P) { return P.fig.userData.brazoDer.userData.mano.getWorldPosition(new THREE.Vector3()); }

function pasoInvocacion(dt) {
  const t = (INV.t += dt);
  const T = reloj.getElapsedTime();
  // 1. Los requeridos alzan su magia; las runas de su Portal despiertan
  una('inicio', () => {
    narrar(`${lista(INVOCACION.need)} están a la vista en Portales distintos: las runas despiertan…`);
    INV.req.forEach(P => { P.anim = 'alzar'; P.t0 = T; });
    granCirculo = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), discoRunico(INVOCACION.c));
    granCirculo.rotation.x = -Math.PI / 2; granCirculo.position.copy(SITIO).setY(0.12); granCirculo.scale.setScalar(0.01); escena.add(granCirculo);
  });
  if (t < 4.2) {
    granCirculo.scale.setScalar(suave(limita(t / 2.5)) * 10);
    granCirculo.rotation.z = t * 0.4;
    if (Math.random() < 0.9) INV.req.forEach(P => chispa(manoDe(P), COLOR_RUNA[P.id], { hacia: CIELO, vida: 1.1, arco: 3, tam: 1.2 }));
    if (t > 1.5) una('funde', () => narrar('…y funden su magia en el cielo.'));
  }
  // 2. Estallido: la criatura cruza el umbral desde el suelo
  if (t >= 4.2) una('boom', () => {
    narrar(`¡${INVOCACION.nombre} cruza el umbral!`);
    estallido(CIELO, [INVOCACION.c, INVOCACION.c2, '#ffffff'], 70, 7, 5);
    INV.req.forEach(P => { P.anim = 'reposo'; });
    criatura = criaturaBloques(INVOCACION); criatura.position.copy(SITIO).setY(-9); escena.add(criatura); opacidadDe(criatura, 0);
    INV.temblor = 0.8;
  });
  if (criatura && t < 12.5) {
    const k = suave(limita((t - 4.2) / 2.6));
    criatura.position.y = -9 + k * (9 + ALTURA_VUELO) + (k >= 1 ? Math.sin(T * 1.2) * 0.35 : 0);
    criatura.userData.alas?.forEach((a, i) => a.rotation.y = (i ? -1 : 1) * (0.2 + Math.sin(T * 2.4) * 0.25));
    if (criatura.userData.gira) criatura.userData.gira.rotation.z = T * 2;
    opacidadDe(criatura, Math.min(1, k * 1.6));
    criatura.rotation.y = Math.sin(T * 0.5) * 0.15;
    if (t < 7 && Math.random() < 0.7) chispa(SITIO.clone().add(new THREE.Vector3(azar(6), 0.3, azar(3))), INVOCACION.c, { vel: new THREE.Vector3(0, 3 + Math.random() * 2, 0), vida: 1.2 });
  }
  granCirculo.rotation.z += dt * (t < 12.5 ? 0.3 : 1.2);
  // 3. Ofrece sus Gemas: orbitan a su alrededor
  const C = SITIO.clone().add(new THREE.Vector3(0, 6.3 + ALTURA_VUELO, 1.6));
  if (t >= 7.2) una('gemas', () => {
    narrar('En agradecimiento, ofrece sus Gemas a quienes la invocaron.');
    for (let i = 0; i < INVOCACION.gemas; i++) { const gm = gemaBloque(colorGema(), INVOCACION.gema ? '#ff6ac0' : null); gm.position.copy(C); escena.add(gm); gemas.push(gm); gm.userData.an = i / INVOCACION.gemas * Math.PI * 2; gm.userData.orbita = true; }
    criatura.userData.brazos.forEach((b, i) => b.rotation.x = -1.1);
  });
  const radio = 2.6 * suave(limita((t - 7.2) / 1));
  gemas.forEach(gm => {
    gm.rotation.y += dt * 2.5;
    if (gm.userData.orbita) { gm.userData.an += dt * 1.4; gm.position.set(C.x + Math.cos(gm.userData.an) * radio, C.y + Math.sin(gm.userData.an * 2 + T) * 0.25, C.z + Math.sin(gm.userData.an) * radio * 0.6); }
  });
  // 4. Reparto: una Gema vuela a cada requerido único en el Portal de un jugador
  INV.req.forEach((P, i) => {
    const t0 = 9.2 + i * 1.5, gm = gemas[i];
    if (!gm || t < t0) return;
    una('vuela' + i, () => { gm.userData.orbita = false; gm.userData.desde = gm.position.clone(); narrar(`Una Gema para ${NOMBRES[P.id]}…`); });
    const destinoG = P.g.position.clone().add(new THREE.Vector3(0, ALTO + 5.2, 0.4));
    const pilaG = P.g.position.clone().add(new THREE.Vector3(1.0, 0.75, 3.4)); // delante, junto a la escalinata
    const k = limita((t - t0) / 1.2);
    if (k < 1) { gm.position.lerpVectors(gm.userData.desde, destinoG, suave(k)); gm.position.y += Math.sin(k * Math.PI) * 4; }
    else {
      una('llega' + i, () => { P.anim = 'celebrar'; P.t0 = T; estallido(destinoG, [colorGema(), '#ffffff', '#ffd86a'], 26, 3, 4); });
      const k2 = suave(limita((t - t0 - 1.2) / 0.7)); gm.position.lerpVectors(destinoG, pilaG, k2); gm.position.y += Math.sin(k2 * Math.PI) * 1.2;
      if (k2 >= 1) una('apila' + i, () => estallido(pilaG, ['#ffd86a', colorGema()], 10, 1.5, 4));
    }
  });
  // 5. Las Gemas que sobran vuelven con la criatura
  if (t >= 14.2) {
    una('sobran', () => { narrar('Las Gemas que nadie recibe se van con la criatura.'); gemas.slice(INV.req.length).forEach(gm => { gm.userData.orbita = false; gm.userData.desde = gm.position.clone(); }); });
    gemas.slice(INV.req.length).forEach((gm, i) => { const k = limita((t - 14.2 - i * 0.2) / 0.8); gm.position.lerpVectors(gm.userData.desde, SITIO.clone().add(new THREE.Vector3(0, 5.2 + ALTURA_VUELO, 0.6)), suave(k)); gm.scale.setScalar(1 - k * 0.9); gm.visible = k < 1; });
  }
  // 6. La criatura parte; el círculo se encoge y queda como la runa del nuevo Portal
  if (t >= 15.4 && criatura) {
    una('parte', () => narrar(`${INVOCACION.nombre} parte. Su círculo deja la marca en el suelo y se encoge…`));
    const k = limita((t - 15.4) / 2);
    criatura.position.y = ALTURA_VUELO + suave(k) * 8; opacidadDe(criatura, 1 - k); criatura.scale.setScalar(1 - k * 0.4);
    if (Math.random() < 0.8) chispa(criatura.position.clone().add(new THREE.Vector3(azar(4), 3 + Math.random() * 5, azar(2))), INVOCACION.c2, { vel: new THREE.Vector3(0, 3, 0), vida: 1 });
    if (k >= 1) { escena.remove(criatura); criatura = null; }
  }
  if (t >= 16.4 && t < 18.4) granCirculo.scale.setScalar(10 - suave((t - 16.4) / 2) * (10 - 3.9));
  // 7. El nuevo Portal central se monta pieza a pieza alrededor de la runa
  if (t >= 18.4) {
    una('portal', () => {
      narrar('…y el nuevo Portal central se construye a su alrededor, pieza a pieza.');
      nuevoPortal = portal(INVOCACION.c, 0); nuevoPortal.position.copy(SITIO); escena.add(nuevoPortal);
      nuevoPortal.userData.runas[0].visible = false; // la runa es el propio círculo de la invocación
      const piezas = [];
      nuevoPortal.traverse(o => { if (o !== nuevoPortal && o.parent === nuevoPortal) piezas.push(o); });
      piezas.forEach(o => {
        const y = new THREE.Box3().setFromObject(o).min.y - SITIO.y;
        o.userData.fin = { p: o.position.clone(), r: o.rotation.clone() };
        o.userData.ini = { p: o.position.clone().add(new THREE.Vector3(azar(10), 9 + Math.random() * 6, azar(10))), r: new THREE.Euler(azar(6), azar(6), azar(6)) };
        o.userData.retraso = Math.min(2.6, y * 0.32) + Math.random() * 0.35;
        o.visible = false;
      });
      INV.piezas = piezas;
    });
    const tp = t - 18.4;
    INV.piezas.forEach(o => {
      if (o.userData.flota) return; // las chispas del Portal flotan por su cuenta
      const k = limita((tp - o.userData.retraso) / 0.65), { ini, fin } = o.userData;
      o.visible = k > 0;
      const e = 1 - Math.pow(1 - k, 3);
      o.position.lerpVectors(ini.p, fin.p, e);
      o.rotation.set(ini.r.x + (fin.r.x - ini.r.x) * e, ini.r.y + (fin.r.y - ini.r.y) * e, ini.r.z + (fin.r.z - ini.r.z) * e);
      if (k >= 1 && !o.userData.encajado) { o.userData.encajado = true; pila++; if (pila % 3 === 0) estallido(SITIO.clone().add(fin.p).setY(fin.p.y + 0.2), ['#c4bfd2', '#a9a4b8'], 3, 1.5, 6); }
    });
    // la runa sube con la tarima
    granCirculo.position.y = 0.12 + suave(limita((tp - 0.4) / 1.4)) * (ALTO - 0.11);
    if (tp > 3.6) una('enciende', () => { narrar('¡Nuevo Portal central!'); estallido(SITIO.clone().setY(ALTO + 0.3), [INVOCACION.c, '#ffffff'], 40, 5, 5); INV.temblor = 0.3; });
    if (tp > 5.5) { INV.activo = false; titulo.firstChild.textContent = 'Todos'; narrar('Desliza para girar · pellizca para acercar · toca un personaje para verlo solo'); }
  }
}

// ---------- una habilidad animada para cada personaje ----------
// Cada escena recibe (E, dt) y devuelve true al acabar. E.t es el tiempo de la escena, E.P quien la usa,
// E.objetivos los Portales afectados. Tras acabar se repite mientras siga elegida «Habilidad».
function fantasma(id, color = '#7fe0ff') {
  const g = PERSONAJES[id]();
  g.traverse(o => { if (o.isMesh) { o.material = (Array.isArray(o.material) ? o.material[0] : o.material).clone(); o.material.transparent = true; o.material.opacity = 0.45; o.material.emissive = new THREE.Color(color); o.material.emissiveIntensity = 0.6; o.material.map = null; o.castShadow = false; } });
  return g;
}
function opacidadObj(g, k) { g.traverse(o => { if (o.isMesh) { const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => { m.transparent = true; m.userData.op ??= m.opacity; m.opacity = m.userData.op * k; }); } }); }
function mirarA(f, P, Q) { const d = Q.g.position.clone().sub(P.g.position); f.rotation.y = Math.atan2(d.x, d.z); }
function brazosA(f, rx, rz = 0.3) { brazos(f, (b, _rx, _rz, s) => { b.rotation.x = rx; b.rotation.z = s * rz; }); }
const cima = (Q, dy = 0) => Q.g.position.clone().add(new THREE.Vector3(0, ALTO + dy, 0));
const unaE = (E, k, fn) => { if (!E.hechos.has(k)) { E.hechos.add(k); fn(); } };
const temp = (E, o) => { (E.temporales ||= []).push(o); escena.add(o); return o; };

const HABILIDADES = {
  // Centinela: golpe de lanza y escudos hexagonales que rodean su Portal (protege a la jugadora)
  centinela(E, dt) {
    const { P, t } = E, f = P.fig;
    unaE(E, 'ini', () => {
      narrar('Centinela: mientras esté visible, ninguna habilidad puede afectar a los Portales de su jugadora.');
      E.escudos = [];
      for (let k = 0; k < 6; k++) {
        const e = new THREE.Group();
        e.add(new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.14, 6), plastico('#b5332b', { emissive: '#e8473a', emissiveIntensity: 0.4, transparent: true })));
        const rib = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.08, 6, 6), plastico('#e2b453', { transparent: true })); rib.rotation.x = Math.PI / 2; e.add(rib);
        const g2 = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.2, 6), plastico('#e2b453', { transparent: true })); g2.position.y = 0.1; e.add(g2);
        e.userData.a = k / 6 * Math.PI * 2; E.escudos.push(temp(E, e));
      }
    });
    const subir = suave(limita((t - 0.7) / 1.1)), bajar = suave(limita((t - 4.4) / 0.8));
    if (t < 0.7) { const k = t / 0.7; f.position.y = ALTO + Math.sin(k * Math.PI) * 0.9; brazosA(f, -2.6 * Math.sin(k * Math.PI), 0.2); }
    unaE(E, 'golpe', () => {}); if (t >= 0.7) unaE(E, 'golpe2', () => { estallido(cima(P, 0.1), ['#e2b453', '#e8473a'], 30, 4, 6); INV.temblor = 0.35; });
    E.escudos.forEach((e, k) => {
      const a = e.userData.a + t * 0.5, R = 3.3;
      e.position.set(P.g.position.x + Math.cos(a) * R, -1 + subir * 3.4 - bajar * 3.4, P.g.position.z + Math.sin(a) * R);
      e.lookAt(P.g.position.x, e.position.y, P.g.position.z); e.rotateX(Math.PI / 2);
      opacidadObj(e, (1 - bajar) * (0.75 + Math.sin(t * 5 + k) * 0.2));
    });
    if (t > 1.2 && t < 4.4) f.userData.brazoIzq.rotation.x = -0.95 + Math.sin(t * 3) * 0.05;
    return t > 5.3;
  },

  // Ocultista: pone bocabajo al personaje de arriba de un Portal; queda tapado por el encapuchado
  ocultista(E, dt) {
    const { P, t } = E, f = P.fig, Q = E.objetivos[0];
    unaE(E, 'ini', () => {
      narrar(`Ocultista: elige un Portal y pone bocabajo al personaje de arriba. ${NOMBRES[Q.id]} queda encapuchado.`);
      const capa = new THREE.Group();
      const cuerpo = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 1.25, 3.4, 6), plastico('#14152a', { transparent: true })); cuerpo.position.y = 1.7; capa.add(cuerpo);
      const cap = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.6, 6), plastico('#1d1f3a', { transparent: true })); cap.position.y = 4.0; capa.add(cap);
      const hueco = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.1, 6), plastico('#000000', { transparent: true })); hueco.rotation.x = Math.PI / 2; hueco.position.set(0, 3.5, 0.62); capa.add(hueco);
      E.capa = temp(E, sombra(capa));
    });
    mirarA(f, P, Q);
    if (t < 3.8) { brazosA(f, -1.6 + Math.sin(t * 8) * 0.05, 0.05); if (t < 1.8 && Math.random() < 0.8) chispa(manoDe(P), '#4a6cff', { hacia: cima(Q, 3), vida: 0.6, arco: 1.5 }); }
    const baja = suave(limita((t - 0.9) / 0.9)), sube = suave(limita((t - 3.9) / 0.9));
    E.capa.position.copy(cima(Q)).add(new THREE.Vector3(0, 8 * (1 - baja) + 8 * sube, 0));
    E.capa.rotation.y = (1 - baja) * 3;
    opacidadObj(E.capa, baja * (1 - sube));
    if (t >= 1.8) unaE(E, 'tapa', () => { Q.fig.visible = false; estallido(cima(Q, 1), ['#4a6cff', '#14152a'], 20, 3, 4); });
    if (t >= 3.9) unaE(E, 'destapa', () => { Q.fig.visible = true; narrar('(En el boceto la vuelve a girar para poder repetirlo.)'); });
    return t > 5.2;
  },

  // Cronista: toma el personaje de arriba de un Portal y se lo lleva a su mano (entra en su libro y sale a su lado)
  cronista(E, dt) {
    const { P, t } = E, f = P.fig, Q = E.objetivos[0];
    unaE(E, 'ini', () => {
      narrar(`Cronista: elige un Portal y se lleva a su mano el personaje de arriba. Se lleva a ${NOMBRES[Q.id]}.`);
      E.copia = temp(E, fundir(PERSONAJES[Q.id]())); E.copia.visible = false;
      E.sitio = P.g.localToWorld(new THREE.Vector3(0, 0, 6.6));
    });
    const libro = () => f.userData.brazoIzq.localToWorld(new THREE.Vector3(0, -1.3, 0.35));
    if (t < 3.2) { mirarA(f, P, Q); brazosA(f, -1.3, 0.15); } else { f.rotation.y = 0; brazosA(f, -0.7, 0.2); }
    // el personaje se encoge girando y entra en el libro convertido en hojas
    const enc = suave(limita((t - 0.6) / 1.6));
    if (t < 2.4) { Q.fig.scale.setScalar(Math.max(0.01, 1 - enc)); Q.fig.rotation.y = enc * 6; if (t > 0.6 && Math.random() < 0.9) chispa(cima(Q, 2 + Math.random() * 2), '#f4ead0', { hacia: libro(), vida: 0.8, arco: 2, tam: 2 }); }
    if (t >= 2.4) unaE(E, 'guarda', () => { Q.fig.visible = false; estallido(libro(), ['#f4ead0', '#e2b453'], 20, 2, 3); narrar(`${NOMBRES[Q.id]} pasa a la mano del Cronista.`); });
    // y sale del libro para quedarse junto a él, en su mano
    if (t >= 2.6 && t < 4.4) {
      E.copia.visible = true; const k = suave(limita((t - 2.6) / 0.9));
      E.copia.position.lerpVectors(libro(), E.sitio, k); E.copia.position.y += Math.sin(k * Math.PI) * 2;
      E.copia.scale.setScalar(0.05 + (ESCALA_MANO - 0.05) * k); E.copia.rotation.y = (1 - k) * 4;
      if (k >= 1) unaE(E, 'aterriza', () => estallido(E.sitio.clone().setY(0.4), ['#f4ead0', '#b48aff'], 10, 2, 5));
    }
    if (t >= 4.4) {
      unaE(E, 'vuelve', () => { narrar('(En el boceto lo devuelve a su Portal para poder repetirlo.)'); E.desde = E.copia.position.clone(); });
      const k = suave(limita((t - 4.4) / 1)); E.copia.position.lerpVectors(E.desde, cima(Q), k); E.copia.position.y += Math.sin(k * Math.PI) * 3;
      E.copia.scale.setScalar(ESCALA_MANO + (1 - ESCALA_MANO) * k);
      if (k >= 1) { Q.fig.visible = true; Q.fig.scale.setScalar(1); Q.fig.rotation.y = 0; E.copia.visible = false; }
    }
    return t > 5.8;
  },

  // Cronomante: reloj de arena (la arena SUBE), ecos del pasado del Portal y uno vuelve arriba
  cronomante(E, dt) {
    const { P, t } = E, f = P.fig, Q = E.objetivos[0];
    unaE(E, 'ini', () => {
      narrar(`Cronomante: examina todos los personajes apilados en el Portal de ${NOMBRES[Q.id]} y sube arriba el que elija.`);
      const reloj = new THREE.Group(), vidrio = new THREE.MeshStandardMaterial({ color: '#bfeaff', transparent: true, opacity: 0.35, roughness: 0.05 });
      for (const sy of [1, -1]) {
        const v = new THREE.Mesh(new THREE.ConeGeometry(0.75, 1.3, 6, 1, true), vidrio); v.position.y = sy * 0.65; v.rotation.x = sy > 0 ? 0 : Math.PI; v.rotation.x += Math.PI; reloj.add(v);
        const tapa = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.22, 6), plastico('#e2b453')); tapa.position.y = sy * 1.4; reloj.add(tapa);

      for (let i = 0; i < 9; i++) { const n = temp(E, new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.5, 6), new THREE.MeshStandardMaterial({ color: '#8a8aa0', transparent: true, opacity: 0.8 }))); n.position.copy(cima(P, 1 + Math.random() * 2.5)).add(new THREE.Vector3(azar(1.6), 0, azar(1.6))); E.humo.push(n); }
    });
    E.humo.forEach((n, i) => { const k = limita((t - 3.6) / 1.6); n.scale.setScalar(1 + k * 1.6); n.position.y += dt * 0.6; n.material.opacity = 0.8 * (1 - k); n.rotation.y += dt * (i % 2 ? 1 : -1); });
    if (t >= 4.9) unaE(E, 'vuelve', () => { f.visible = true; estallido(cima(P, 1.5), ['#8a8aa0', '#3a8fd6'], 10, 2, 4); });
    return t > 5.6;
  },

  // Metamorfo: gira entre humo rosa y pasa a parecer otro personaje (no animal), con la ficha encima
  metamorfo(E, dt) {
    const { P, t } = E, f = P.fig;
    unaE(E, 'ini', () => {
      const opciones = ['clarividente', 'cronomante', 'centinela', 'ocultista', 'estratega', 'cronista', 'aprendiz', 'picaro', 'maestro'];
      P.ciclo = ((P.ciclo ?? -1) + 1) % opciones.length; E.como = opciones[P.ciclo];
      narrar(`Metamorfo: paga una Gema de 1 y toma la ficha de ${NOMBRES[E.como]}. Cuenta como él mientras siga a la vista.`);
      E.otro = PERSONAJES[E.como](); E.otro.visible = false; P.g.add(E.otro); (E.temporales ||= []).push(E.otro);
      // la ficha: medallón hexagonal rosa con el color del personaje imitado
      const ficha = new THREE.Group();
      ficha.add(new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.16, 6), plastico('#ff8ad8', { emissive: '#ff4ab8', emissiveIntensity: 0.4 })));
      const centro = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.2, 6), brillo(COLOR_RUNA[E.como], 1.4)); ficha.add(centro);
      const aro = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.07, 6, 6), plastico('#e2b453')); aro.rotation.x = Math.PI / 2; ficha.add(aro);
      ficha.children.forEach(c => c.rotation.x += Math.PI / 2);
      E.ficha = temp(E, ficha);
    });
    const giro1 = limita(t / 1.4), giro2 = limita((t - 4.2) / 1.2);
    const quien = t < 1.4 || t >= 4.8 ? f : E.otro;
    f.visible = quien === f; E.otro.visible = quien === E.otro;
    E.otro.position.set(0, ALTO, 0);
    const w = (giro1 > 0 && giro1 < 1) ? giro1 : (giro2 > 0 && giro2 < 1 ? giro2 : 0);
    quien.rotation.y = w * Math.PI * 6; quien.position.y = ALTO + Math.sin(w * Math.PI) * 1.2;
    if (w > 0 && Math.random() < 0.9) chispa(cima(P, Math.random() * 4).add(new THREE.Vector3(azar(2.4), 0, azar(2.4))), Math.random() < 0.5 ? '#ff8ad8' : '#5fe0d0', { vel: new THREE.Vector3(azar(2), 2, azar(2)), vida: 0.9 });
    if (t >= 1.4) unaE(E, 'cambia', () => { estallido(cima(P, 2), ['#ff8ad8', '#5fe0d0', '#ffffff'], 30, 4, 4); });
    if (t >= 4.8) unaE(E, 'vuelve', () => { estallido(cima(P, 2), ['#ff8ad8', '#5fe0d0'], 20, 3, 4); narrar('Al taparlo o girarlo, la ficha vuelve a la reserva y es de nuevo Metamorfo.'); });
    const ve = suave(limita((t - 1.6) / 0.5)) * (1 - suave(limita((t - 4.2) / 0.4)));
    E.ficha.position.copy(cima(P, 5.6 + Math.sin(t * 2) * 0.15)); E.ficha.rotation.y = t * 1.5; E.ficha.scale.setScalar(ve + 0.001);
    if (E.otro.visible) brazosA(E.otro, -0.6 + Math.sin(t * 3) * 0.1, 0.35);
    return t > 6.2;
  },
};
// Los animales no tienen habilidad: solo cuentan para algunas invocaciones
for (const id of ['reena', 'sora', 'lumo']) HABILIDADES[id] = (E, dt) => {
  const { P, t } = E, f = P.fig;
  unaE(E, 'ini', () => {
    const para = Object.values(CRIATURAS).filter(C => C.need.includes(id)).map(C => C.nombre).join(', ').replace(/, ([^,]*)$/, ' y $1');
    narrar(`${NOMBRES[id]} no tiene habilidad, pero hace falta para invocar a ${para}.`);
  });
  const k = (t / 0.8) % 1;
  if (t < 2.4) { f.position.y = ALTO + Math.sin(k * Math.PI) * 0.9; f.rotation.y = Math.floor(t / 0.8) === 1 ? k * Math.PI * 2 : 0; }
  if (Math.random() < 0.15) chispa(cima(P, 1.5).add(new THREE.Vector3(azar(2), 0, azar(2))), COLOR_RUNA[id], { vel: new THREE.Vector3(0, 2, 0), vida: 0.8 });
  return t > 3.2;
};

const ESCENAS = [];
function objetivosDe(P) {
  // los Portales más cercanos, para que se vean bien en el móvil
  const cerca = puestos.filter(Q => Q !== P).sort((a, b) => a.g.position.distanceTo(P.g.position) - b.g.position.distanceTo(P.g.position));
  if (P.id === 'estratega') return [cerca[0], cerca[1]];
  if (P.id === 'aprendiz' || P.id === 'maestro') {
    // sin tocar manos que ya están moviendo otras escenas
    const ocupados = new Set(ESCENAS.filter(E => ['aprendiz', 'maestro'].includes(E.P.id)).flatMap(E => [E.P, ...E.objetivos]));
    const libres = cerca.filter(Q => !ocupados.has(Q) && Q.id !== 'clarividente');
    return P.id === 'aprendiz' ? libres.slice(0, 2) : libres.slice(0, 1);
  }
  if (['ocultista', 'cronista', 'cronomante'].includes(P.id)) return [cerca[0]];
  return [];
}
function empezarHabilidad(P) {
  if (!HABILIDADES[P.id]) return;
  if (['aprendiz', 'maestro'].includes(P.id) && ESCENAS.some(E => E.objetivos.includes(P) && ['aprendiz', 'maestro'].includes(E.P.id))) return;
  const viejo = ESCENAS.find(E => E.P === P); if (viejo) terminarEscena(viejo);
  const E = { P, t: 0, hechos: new Set(), objetivos: objetivosDe(P) };
  if ((P.id === 'aprendiz' && E.objetivos.length < 2) || (P.id === 'maestro' && !E.objetivos.length)) return;
  ESCENAS.push(E);
  E.objetivos.forEach(Q => Q.g.visible = true);
  if (elegido >= 0) { // de cerca: encuadra el efecto y los Portales afectados
    const ps = [P, ...E.objetivos].map(Q => Q.g.position), c = ps.reduce((a, b) => a.clone().add(b)).multiplyScalar(1 / ps.length);
    const ancho = Math.max(...ps.map(p => p.distanceTo(c)));
    c.z += 2.6; destino = { pos: c.setY(3.2), dist: (vertical() ? 34 : 21) + ancho * (vertical() ? 3.0 : 1.6) };
  }
}
function terminarEscena(E) {
  E.alTerminar?.();
  (E.temporales || []).forEach(o => o.parent?.remove(o));
  E.P.fig.visible = true;
  E.objetivos.forEach(Q => { Q.fig.visible = true; Q.fig.scale.setScalar(1); Q.fig.rotation.set(0, 0, 0); Q.g.rotation.y = 0; Q.g.position.y = 0; Q.g.visible = elegido < 0 || puestos.indexOf(Q) === elegido || ESCENAS.some(X => X !== E && X.objetivos.includes(Q)); });
  ESCENAS.splice(ESCENAS.indexOf(E), 1);
}
function pasoHabilidades(dt) {
  for (const E of [...ESCENAS]) {
    E.t += dt;
    if (HABILIDADES[E.P.id](E, dt)) {
      terminarEscena(E);
      if (E.P.anim === 'habilidad') setTimeout(() => { if (E.P.anim === 'habilidad') empezarHabilidad(E.P); }, 900);
      else narrar('Desliza para girar · pellizca para acercar · toca un personaje para verlo solo');
    }
  }
}

// ---------- cámara (cenital 3/4) y gestos ----------
const distGeneral = () => vertical() ? 64 + filas * 9 : 26 + filas * 8;
let ang = Number(params.get('ang') || 0), alt = Number(params.get('alt') || 0.6), dist = Number(params.get('dist') || distGeneral());
const objetivo = new THREE.Vector3(0, Number(params.get('y') || 1.6), 0);
let destino = null; // { pos, dist }
function colocarCamara() {
  if (destino) {
    const k = 1 - Math.exp(-dtCam * 5);
    objetivo.lerp(destino.pos, k); dist += (destino.dist - dist) * k;
    if (objetivo.distanceTo(destino.pos) < 0.01 && Math.abs(destino.dist - dist) < 0.05) destino = null;
  }
  camara.position.set(objetivo.x + Math.sin(ang) * Math.cos(alt) * dist, objetivo.y + Math.sin(alt) * dist, objetivo.z + Math.cos(ang) * Math.cos(alt) * dist);
  camara.lookAt(objetivo);
  if (INV.temblor > 0) { INV.temblor = Math.max(0, INV.temblor - dtCam); const a = INV.temblor * 0.6; camara.position.add(new THREE.Vector3(azar(a), azar(a), azar(a))); }
}
const punteros = new Map();
let pellizco = null, movido = 0;
const lienzoEl = renderer.domElement;
lienzoEl.addEventListener('pointerdown', e => { lienzoEl.setPointerCapture(e.pointerId); punteros.set(e.pointerId, [e.clientX, e.clientY]); movido = 0; pellizco = null; });
lienzoEl.addEventListener('pointermove', e => {
  if (!punteros.has(e.pointerId)) return;
  const prev = punteros.get(e.pointerId); punteros.set(e.pointerId, [e.clientX, e.clientY]);
  if (punteros.size === 1) {
    const dx = e.clientX - prev[0], dy = e.clientY - prev[1]; movido += Math.abs(dx) + Math.abs(dy);
    ang -= dx * 0.007; alt = Math.min(1.45, Math.max(0.08, alt + dy * 0.005));
  } else if (punteros.size === 2) {
    const [a, b] = [...punteros.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pellizco) { dist = Math.min(160, Math.max(5, dist * pellizco / d)); destino = null; }
    pellizco = d; movido += 99;
  }
});
function soltar(e) {
  if (punteros.size === 1 && movido < 8) tocar(e.clientX, e.clientY);
  punteros.delete(e.pointerId); pellizco = null;
}
lienzoEl.addEventListener('pointerup', soltar);
lienzoEl.addEventListener('pointercancel', e => { punteros.delete(e.pointerId); pellizco = null; });
lienzoEl.addEventListener('wheel', e => { e.preventDefault(); destino = null; dist = Math.min(160, Math.max(5, dist * (1 + e.deltaY * 0.001))); }, { passive: false });
addEventListener('resize', () => { camara.aspect = innerWidth / innerHeight; camara.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const rayo = new THREE.Raycaster();
function tocar(x, y) {
  rayo.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), camara);
  const hit = rayo.intersectObjects(puestos.map(p => p.g), true).find(h => h.object.userData.puesto !== undefined);
  if (hit) elegir(hit.object.userData.puesto);
}

// ---------- panel ----------
let elegido = -1; // -1 = todos
const filaP = document.getElementById('filaPersonajes'), filaA = document.getElementById('filaAnimaciones');
const titulo = document.getElementById('titulo');
function boton(fila, texto, fn, clase = '') { const b = document.createElement('button'); b.textContent = texto; b.className = clase; b.onclick = fn; fila.appendChild(b); return b; }
boton(filaP, '‹', () => elegir(elegido <= 0 ? puestos.length - 1 : elegido - 1), 'flecha');
const botonesP = [boton(filaP, 'Todos', () => elegir(-1))];
puestos.forEach((P, i) => botonesP.push(boton(filaP, NOMBRES[P.id], () => elegir(i))));
boton(filaP, '›', () => elegir(elegido >= puestos.length - 1 ? 0 : elegido + 1), 'flecha');
const botonesA = {};
Object.entries(ANIMACIONES).forEach(([k, v]) => botonesA[k] = boton(filaA, v, () => ponerAnim(k)));
filaA.appendChild(Object.assign(document.createElement('span'), { className: 'sep' }));
const filaI = document.getElementById('filaInvocaciones');
boton(filaA, '✦ Invocar', () => { filaI.hidden = !filaI.hidden; }, 'invocar');
Object.entries(CRIATURAS).forEach(([k, C]) => boton(filaI, C.nombre, () => { filaI.hidden = true; empezarInvocacion(k); }, 'criatura'));
filaI.querySelectorAll('button').forEach((b, i) => { const C = Object.values(CRIATURAS)[i]; b.style.borderColor = C.c; b.title = `${C.set}: ${lista(C.need)}`; });

function elegir(i) {
  elegido = i;
  [...ESCENAS].forEach(E => { E.P.anim = 'reposo'; terminarEscena(E); });
  botonesP.forEach((b, k) => b.classList.toggle('activo', k === i + 1));
  puestos.forEach((P, k) => P.g.visible = i < 0 || k === i); // de cerca, solo el elegido
  botonesP[i + 1].scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
  if (i < 0) { destino = { pos: new THREE.Vector3(0, 2, 2.5), dist: distGeneral() }; titulo.firstChild.textContent = 'Todos'; }
  else {
    const P = puestos[i];
    destino = { pos: new THREE.Vector3(P.g.position.x, 2.6, P.g.position.z + 2.4), dist: vertical() ? 34 : 20 };
    titulo.firstChild.textContent = NOMBRES[P.id];
  }
  marcarAnim();
}
function seleccionados() { return elegido < 0 ? puestos : [puestos[elegido]]; }
function ponerAnim(k) {
  const t = reloj.getElapsedTime();
  seleccionados().forEach(P => { P.anim = k; P.t0 = t; });
  [...ESCENAS].forEach(E => { if (E.P.anim !== 'habilidad') terminarEscena(E); });
  if (k === 'habilidad') seleccionados().forEach(empezarHabilidad);
  marcarAnim();
}
function marcarAnim() { const a = seleccionados()[0].anim; const igual = seleccionados().every(P => P.anim === a); Object.entries(botonesA).forEach(([k, b]) => b.classList.toggle('activo', igual && k === a)); }

const quieto = params.has('quieto');
const reloj = new THREE.Clock();
let dtCam = 0.016, tPrev = 0;
function bucle() {
  const real = reloj.getElapsedTime(); dtCam = Math.min(0.1, real - tPrev); tPrev = real;
  const T = quieto ? 0.6 : real;
  puestos.forEach(P => animar(P, quieto ? 0.6 : T - P.t0, T));
  moverFlotantes(quieto ? 1.3 : real);
  if (INV.activo) pasoInvocacion(dtCam);
  pasoHabilidades(dtCam);
  moverParticulas(dtCam);
  colocarCamara();
  renderer.render(escena, camara);
  requestAnimationFrame(bucle);
}
camara.aspect = innerWidth / innerHeight; camara.updateProjectionMatrix();
const inicial = orden.indexOf(params.get('ver'));
window.ESCENAS = ESCENAS;
elegir(inicial);
if (params.get('anim')) setTimeout(() => ponerAnim(params.get('anim')), 200);
if (params.has('invocar')) setTimeout(() => empezarInvocacion(params.get('invocar') || 'baelorith'), 300);
if (inicial >= 0 || params.has('dist')) { if (destino) { objetivo.copy(destino.pos); if (!params.has('dist')) dist = destino.dist; destino = null; } }
bucle();
window.listo = true;
</script>
