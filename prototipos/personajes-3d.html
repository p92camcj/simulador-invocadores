<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<title>Invocadores · maqueta de personajes 3D</title>
<style>
  :root { --tinta: #eef2ff; --panel: rgba(14, 18, 44, .82); --borde: rgba(170, 200, 255, .25); --oro: #ffd98a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f24; color: var(--tinta); font: 15px/1.35 system-ui, sans-serif; overscroll-behavior: none; }
  #lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: calc(8px + env(safe-area-inset-top)) 12px 18px; pointer-events: none;
    background: linear-gradient(#0a0f24e6, #0a0f2400); text-shadow: 0 1px 3px #000; }
  #titulo { font-weight: 700; color: var(--oro); letter-spacing: .02em; }
  #texto { margin-top: 4px; min-height: 3.9em; max-width: 46em; font-size: 14px; }
  #fps { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 10px; font-size: 11px; opacity: .6; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; justify-content: center; padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(#0a0f2400, #0a0f24e6); }
  button { font: inherit; color: var(--tinta); background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; min-height: 44px; min-width: 44px; padding: 0 12px; cursor: pointer; }
  button:active { background: rgba(80, 100, 200, .6); }
  #btnEscenas { flex: 1; max-width: 16em; font-weight: 600; }
  #hoja { position: fixed; left: 0; right: 0; bottom: 0; max-height: 78%; overflow: auto; background: var(--panel); backdrop-filter: blur(8px); border-top: 1px solid var(--borde);
    border-radius: 18px 18px 0 0; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .25s; }
  #hoja.abierta { transform: none; }
  #hoja h3 { margin: 14px 4px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--oro); }
  #lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  #lista h3 { grid-column: 1 / -1; }
  #lista button { text-align: left; padding: 8px 10px; }
  #lista button.activa { border-color: var(--oro); }
  .fila { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .fila button { flex: 1; }
  #cerrarHoja { flex: 0 0 44px; }
  .nota { font-size: 12px; opacity: .75; margin: 10px 4px 0; }
  #barraColocar { display: none; position: fixed; left: 0; right: 0; bottom: 0; gap: 8px; justify-content: center; padding: 10px 8px calc(10px + env(safe-area-inset-bottom)); }
  #barraColocar button { flex: 1; max-width: 12em; font-weight: 600; }
  #btnListo { border-color: var(--oro); }
  body.colocando nav { display: none; } body.colocando #barraColocar { display: flex; }
  #portada { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; padding: 24px; background: #0a0f24f2; }
  #portada h1 { margin: 0; font-size: 22px; color: var(--oro); }
  #portada p { margin: 0 auto; max-width: 30em; font-size: 14px; opacity: .85; }
  #empezar { justify-self: center; padding: 0 28px; font-weight: 700; border-color: var(--oro); }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="flash"></div>
<header><div id="titulo"></div><div id="texto"></div></header>
<div id="fps"></div>
<nav>
  <button id="btnAnt" aria-label="Escena anterior">◀</button>
  <button id="btnEscenas">Escenas ▴</button>
  <button id="btnRepetir" aria-label="Repetir escena">↻</button>
  <button id="btnSig" aria-label="Escena siguiente">▶</button>
  <button id="btnSonido" aria-label="Sonido">🔊</button>
</nav>
<div id="barraColocar"><button id="btnRestablecer">Restablecer</button><button id="btnListo">✓ Listo</button></div>
<div id="hoja">
  <div class="fila"><button id="btnTodas">▶ Ver todas seguidas</button><button id="btnCalidad"></button><button id="btnColocar">✥ Colocar Portales</button><button id="cerrarHoja" aria-label="Cerrar">✕</button></div>
  <div id="lista"></div>
  <p class="nota">Arrastra para girar la cámara y pellizca para acercar. Maqueta para aprobar: no forma parte del juego todavía. Sonido generado con Web Audio; gráficos con three.js (MIT).</p>
</div>
<div id="portada">
  <h1>Invocadores · personajes 3D</h1>
  <p>Maqueta de animaciones para aprobar, escena a escena. Mejor con sonido.</p>
  <button id="empezar" disabled>Cargando…</button>
</div>
<script type="module" src="../js/personajes3d/main.js"></script>
</body>
</html>
